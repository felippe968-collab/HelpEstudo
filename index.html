<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>HelpEstudo</title>
<script>try{if(localStorage.getItem('helpestudo_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
/* ============================================================
   HELPESTUDO - tema noturno, layout mobile-first
   Todas as cores ficam aqui em cima pra facilitar ajustes
   ============================================================ */
:root{
  --bg:#070b12;
  --bg-2:#0b111c;
  --card:#111a28;
  --card-2:#16202f;
  --line:#1e2b3f;
  --line-2:#2a3a54;
  --txt:#e9effb;
  --muted:#8ea3c0;
  --accent:#6c8cff;
  --accent-2:#22d3a6;
  --red:#ef4444;
  --orange:#f97316;
  --yellow:#eab308;
  --green:#22c55e;
  --r:16px;
  --shadow:0 18px 40px -24px #000;
  --nav-h:66px;
  --x0d1521:#0d1521;
  --x0a111b:#0a111b;
  --x0b1320:#0b1320;
  --x101a29:#101a29;
  --x0b1119:#0b1119;
  --x0f1927:#0f1927;
  --x0c131f:#0c131f;
  --x131f32:#131f32;
  --x1b2739:#1b2739;
  --x8ff0b3:#8ff0b3;
  --xc6ffdc:#c6ffdc;
  --xffe07a:#ffe07a;
  --xffe9a3:#ffe9a3;
  --xff9c9c:#ff9c9c;
  --xffb0b0:#ffb0b0;
  --xffb4bb:#ffb4bb;
  --xffc2c2:#ffc2c2;
  --xe6b9b9:#e6b9b9;
  --xdbe3ff:#dbe3ff;
  --xcdd8ff:#cdd8ff;
  --xd5deff:#d5deff;
  --xb9c8dd:#b9c8dd;
  --xc3d1e4:#c3d1e4;
  --xc9d6ea:#c9d6ea;
  --xb9c6ee:#b9c6ee;
  --x7d8da6:#7d8da6;
  --x6d7f99:#6d7f99;
  --x71809a:#71809a;
  --x5b6c85:#5b6c85;
  --xffb27a:#ffb27a;
  --xff8a5b:#ff8a5b;
  --x8ff0d8:#8ff0d8;
  --x1f6a41:#1f6a41;
  --x2c8f5e:#2c8f5e;
  --x7a6518:#7a6518;
  --x8a7216:#8a7216;
  --x7a2630:#7a2630;
  --x7a2430:#7a2430;
  --x7a2b30:#7a2b30;
  --x1c6b58:#1c6b58;
  --x7a4520:#7a4520;
  --x24405a:#24405a;
  --x3a1418:#3a1418;
  --glow-1:#17233a;
  --glow-2:#131c2c;
  --top-a:rgba(7,11,18,.96);
  --top-b:rgba(7,11,18,.72);
  --nav-a:rgba(7,11,18,.99);
  --nav-b:rgba(7,11,18,.86);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(900px 500px at 100% -10%, var(--glow-1) 0%, transparent 60%),
    radial-gradient(700px 400px at -10% 0%, var(--glow-2) 0%, transparent 55%),
    var(--bg);
  color:var(--txt);
  min-height:100vh;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:Arial,Helvetica,sans-serif;font-size:16px;color:inherit}
*{font-family:Arial,Helvetica,sans-serif}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,h4,p{margin:0}
.hidden{display:none !important}
a{color:var(--accent)}

/* ---------- estrutura ---------- */
#app{max-width:760px;margin:0 auto;padding:0 14px calc(var(--nav-h) + 78px)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* ---------- barra de topo ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px);
  background:linear-gradient(to bottom, var(--top-a), var(--top-b));
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:760px;margin:0 auto;padding:12px 14px;
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(140deg,var(--accent),#a06cff 70%);
  display:grid;place-items:center;font-size:18px;font-weight:800;color:#fff;
  box-shadow:0 8px 20px -10px var(--accent);
}
.brand-txt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.brand-txt b{font-size:15px;letter-spacing:.2px}
.brand-txt span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.avatar{
  width:38px;height:38px;border-radius:50%;margin-left:auto;flex:0 0 auto;
  border:1.5px solid var(--line-2);background:var(--card-2);
  display:grid;place-items:center;overflow:hidden;font-size:16px;font-weight:700;color:var(--muted);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- cartões ---------- */
.card{
  background:linear-gradient(180deg,var(--card),var(--card-2));
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:16px;
  box-shadow:var(--shadow);
}
.card + .card{margin-top:12px}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-title h3{font-size:15px;font-weight:700;letter-spacing:.2px}
.card-title .sp{margin-left:auto}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}

/* ---------- botões ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 16px;border-radius:12px;
  font-weight:650;font-size:14.5px;letter-spacing:.1px;
  background:var(--card-2);border:1px solid var(--line-2);color:var(--txt);
  transition:transform .08s ease, filter .15s ease;
}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#8a6cff);border-color:transparent;color:#fff;box-shadow:0 12px 24px -14px var(--accent)}
.btn.green{background:linear-gradient(135deg,#12b981,#22d3a6);border-color:transparent;color:#04231a}
.btn.danger{background:var(--x3a1418);border-color:var(--x7a2430);color:var(--xffb4bb)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.xs{min-height:30px;padding:0 10px;font-size:12px;border-radius:9px;font-weight:600}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--line-2);background:var(--card-2);font-size:15px;color:var(--muted);
}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}

/* ---------- home / contagem ---------- */
.hero{position:relative;overflow:hidden}
.hero:before{
  content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;
  background:radial-gradient(circle,rgba(108,140,255,.22),transparent 65%);pointer-events:none;
}
.countdown{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
.countdown .big{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.countdown .unit{font-size:15px;color:var(--muted);font-weight:600}
.countdown.hot .big{color:var(--xff8a5b)}
.countdown.today .big{color:var(--green)}
.hero-date{font-size:13px;color:var(--muted)}

/* ---------- horas ---------- */
.hours-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--x0d1521);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.stat .v{font-size:17px;font-weight:750;margin-top:3px;letter-spacing:-.3px}
.stat .v small{font-size:11px;font-weight:600;color:var(--muted)}
.callout{
  margin-top:12px;padding:12px;border-radius:12px;
  background:linear-gradient(135deg,rgba(34,211,166,.10),rgba(108,140,255,.08));
  border:1px solid var(--x24405a);font-size:13.5px;
}
.callout b{color:var(--accent-2)}
.progress{height:9px;border-radius:99px;background:var(--x0a111b);border:1px solid var(--line);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .35s ease}
.progress-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;gap:11px;
  background:var(--x0d1521);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;text-align:left;width:100%;
}
.item:active{background:var(--x101a29)}
.item[data-act]{cursor:pointer}
.item .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.item .txt{min-width:0;flex:1}
.item .txt b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .txt span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.item .right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.chev{color:var(--line-2);font-size:18px;line-height:1}

.empty{
  text-align:center;padding:22px 14px;color:var(--muted);font-size:13.5px;
  border:1px dashed var(--line-2);border-radius:12px;background:var(--x0b1119);
}
.empty b{display:block;color:var(--txt);font-size:14.5px;margin-bottom:4px}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 11px;border-radius:99px;font-size:12.5px;font-weight:600;
  background:var(--x0d1521);border:1px solid var(--line-2);color:var(--muted);
}
.chip.on{background:rgba(108,140,255,.16);border-color:var(--accent);color:var(--xcdd8ff)}
.chip.tap:active{transform:scale(.96)}
.chip .x{font-size:13px;color:var(--muted)}

/* ---------- dificuldade em barrinhas ----------
   I vermelho · II laranja · III amarelo · IV verde */
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}
.bar{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;
  padding:9px 6px 7px;border-radius:12px;min-height:82px;
  background:var(--x0a111b);border:1.4px solid var(--line-2);color:var(--muted);
  font-weight:800;font-size:11.5px;letter-spacing:.04em;
  transition:transform .09s ease, border-color .15s ease, background .15s ease;
}
.bar:active{transform:scale(.97)}
.bar i{display:block;width:100%;border-radius:5px 5px 3px 3px;opacity:.32;transition:opacity .15s ease}
.bar:nth-child(1) i{height:9px;background:var(--red)}
.bar:nth-child(2) i{height:19px;background:var(--orange)}
.bar:nth-child(3) i{height:29px;background:var(--yellow)}
.bar:nth-child(4) i{height:39px;background:var(--green)}
.bar.on{color:#fff}
.bar.on i{opacity:1}
.bar:nth-child(1).on{background:rgba(239,68,68,.16);border-color:var(--red)}
.bar:nth-child(2).on{background:rgba(249,115,22,.16);border-color:var(--orange)}
.bar:nth-child(3).on{background:rgba(234,179,8,.15);border-color:var(--yellow)}
.bar:nth-child(4).on{background:rgba(34,197,94,.15);border-color:var(--green)}
.bar-legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:7px;font-weight:700;letter-spacing:.04em}

/* aviso de revisão */
.warn{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,rgba(239,68,68,.16),rgba(249,115,22,.12));
  border:1px solid var(--x7a2b30);border-radius:12px;padding:11px 12px;margin-top:12px;
}
.warn .wt{flex:1;min-width:0}
.warn .wt b{display:block;font-size:12px;letter-spacing:.02em;color:var(--xffc2c2)}
.warn .wt span{display:block;font-size:11.5px;color:var(--xe6b9b9);margin-top:2px;line-height:1.4}
.badge.rev{background:rgba(239,68,68,.15);border-color:var(--x7a2b30);color:var(--xffb0b0)}

/* ---------- calendário de estudos ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:2px}
.day-pill{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;
  border-radius:11px;border:1.4px solid var(--line);background:var(--x0a111b);color:var(--muted);
  min-height:60px;justify-content:center;
}
.day-pill b{font-size:11px;font-weight:800;letter-spacing:.02em}
.day-pill span{font-size:10.5px;font-weight:700;color:var(--x7d8da6)}
.day-pill.on{background:rgba(108,140,255,.16);border-color:var(--accent);color:var(--xdbe3ff)}
.day-pill.on span{color:var(--xb9c6ee)}
.day-pill.hj:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent-2);margin-top:2px}
.day-pill.hj b{color:var(--accent-2)}
.day-pill.on.hj b{color:var(--xdbe3ff)}
.blk{
  display:flex;gap:11px;align-items:flex-start;
  background:var(--x0d1521);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
}
.blk + .blk{margin-top:8px}
.blk .hr{
  font-size:11px;font-weight:800;color:var(--xb9c8dd);white-space:nowrap;
  background:var(--x0a111b);border:1px solid var(--line-2);border-radius:8px;padding:4px 7px;line-height:1.2;text-align:center;
}
.blk .info{flex:1;min-width:0}
.blk .info b{display:block;font-size:14px;font-weight:650}
.blk .info .foco{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.blk .info .met{font-size:10.5px;color:var(--x6d7f99);margin-top:3px}
.blk .acts{display:flex;gap:4px;flex:0 0 auto}
.blk .acts .icon-btn{width:30px;height:30px;border-radius:9px;font-size:12px}
.dot-sub{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.imp-file{font-size:12.5px;padding:9px 10px}

/* ---------- questões (pergunta e resposta) ---------- */
.qtext{font-size:16px;font-weight:650;line-height:1.45;margin:2px 0 4px;white-space:pre-wrap}
.qmeta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin:2px 0 10px}
.opt{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  background:var(--x0d1521);border:1.4px solid var(--line-2);border-radius:12px;
  padding:11px 12px;margin-top:8px;color:var(--txt);font-size:14px;line-height:1.4;
  transition:border-color .14s ease, background .14s ease;
}
.opt:active{transform:scale(.995)}
.opt .ltr{
  flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--x0a111b);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--muted);
}
.opt .otxt{flex:1;min-width:0;white-space:pre-wrap}
.opt.ok{border-color:var(--green);background:rgba(34,197,94,.13)}
.opt.ok .ltr{background:var(--green);color:#04231a;border-color:var(--green)}
.opt.bad{border-color:var(--red);background:rgba(239,68,68,.12)}
.opt.bad .ltr{background:var(--red);color:#2a0b0b;border-color:var(--red)}
.qcomment{margin-top:12px;font-size:12.5px;color:var(--xc3d1e4);background:var(--x0d1521);border:1px solid var(--line);border-radius:10px;padding:10px 11px;line-height:1.5}
.rad{width:22px;height:22px;flex:0 0 auto;accent-color:#6c8cff;margin:0}
.badge{
  font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);
}
.badge.d0{background:rgba(239,68,68,.15);border-color:var(--x7a2630);color:var(--xff9c9c)}
.badge.d3{background:rgba(249,115,22,.15);border-color:var(--x7a4520);color:var(--xffb27a)}
.badge.d4{background:rgba(234,179,8,.14);border-color:var(--x7a6518);color:var(--xffe07a)}
.badge.d5{background:rgba(34,197,94,.14);border-color:var(--x1f6a41);color:var(--x8ff0b3)}
.badge.ok{background:rgba(34,211,166,.14);border-color:var(--x1c6b58);color:var(--x8ff0d8)}

/* ---------- rotina de estudos (pesos, blocos e planilha) ---------- */
.rot-chart{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.rot-bar{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center}
.rot-bar b{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rot-bar .num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rot-bar .track{grid-column:1/-1;height:8px;border-radius:99px;background:#0a111b;border:1px solid var(--line);overflow:hidden}
.rot-bar .track i{display:block;height:100%;border-radius:99px;min-width:4px}
html[data-theme="light"] .rot-bar .track{background:#eef2f9}
.rot-sec{margin-top:14px}
.rot-sec-t{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rot-days{display:flex;flex-wrap:wrap;gap:6px}
.day-chk{position:relative;display:inline-flex}
.day-chk input{position:absolute;opacity:0;pointer-events:none}
.day-chk span{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 11px;border-radius:11px;border:1.4px solid var(--line-2);background:#0d1521;color:var(--muted);font-size:12.5px;font-weight:700}
.day-chk input:checked + span{background:rgba(108,140,255,.16);border-color:var(--accent);color:#cfd9ff}
html[data-theme="light"] .day-chk span{background:#f7f9fd}
html[data-theme="light"] .day-chk input:checked + span{background:rgba(108,140,255,.18);color:#2b3d7a}
.tipo-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tipo{position:relative;display:block}
.tipo input{position:absolute;opacity:0;pointer-events:none}
.tipo span{display:block;padding:11px 12px;border-radius:12px;border:1.4px solid var(--line-2);background:#0d1521;font-size:13px;font-weight:650;line-height:1.25}
.tipo span small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:3px}
.tipo input:checked + span{border-color:var(--accent);background:rgba(108,140,255,.14)}
html[data-theme="light"] .tipo span{background:#f7f9fd}
.rot-sheet{display:flex;flex-direction:column;gap:12px}
.rot-day{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0d1521}
html[data-theme="light"] .rot-day{background:#fff}
.rot-day-h{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;background:#101a29;border-bottom:1px solid var(--line);font-size:12px}
html[data-theme="light"] .rot-day-h{background:#f1f5fb}
.rot-day-h b{font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.rot-day-h .sp{flex:1}
.rot-day-h .pg{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rot-day-h .btn.xs{min-height:30px;padding:0 9px}
.rot-row{display:grid;grid-template-columns:46px 1fr auto;gap:6px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line);border-left:3px solid var(--red)}
.rot-row:last-child{border-bottom:0}
.rot-row.done{border-left-color:var(--green);background:rgba(34,197,94,.07)}
.rot-row.void{border-left-color:var(--line-2)}
.rot-row .t{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.rot-row .t b{display:block;color:var(--txt);font-size:12.5px;font-weight:700}
.rot-row .m{min-width:0}
.rot-row .m .sub{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rot-row .m .sub .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.rot-row .m .con{font-size:13px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rot-row.done .m .con{text-decoration:line-through;color:var(--muted)}
.rot-row .a{display:flex;gap:4px}
.rot-row .a button{width:30px;height:32px;border-radius:9px;border:1px solid var(--line-2);background:#101a29;color:var(--txt);font-size:13px;display:flex;align-items:center;justify-content:center;line-height:1}
html[data-theme="light"] .rot-row .a button{background:#f4f7fc}
.rot-row .a button.ok{background:rgba(34,197,94,.18);border-color:#1f6a41;color:#8ff3b8}
.rot-bloco-resumo{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rot-bloco-resumo .chip{font-size:11.5px}

/* ---------- checkbox de aula ---------- */
.check{
  position:relative;
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  border:1.6px solid var(--line-2);background:var(--x0a111b);display:grid;place-items:center;
  font-size:14px;color:transparent;font-weight:800;
}
.check.on{background:var(--green);border-color:var(--green);color:#04231a}
/* aumenta a área tocável sem aumentar o quadradinho */
.check:after{content:"";position:absolute;inset:-10px}
.item.done .txt b{text-decoration:line-through;color:var(--muted)}

/* ---------- cabeçalho de página ---------- */
.page-head{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.page-head h2{font-size:19px;font-weight:750;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.back{width:38px;height:38px;border-radius:11px;border:1px solid var(--line-2);background:var(--card-2);display:grid;place-items:center;font-size:17px;color:var(--txt);flex:0 0 auto}

/* ---------- tela inicial: onboarding ---------- */
.onboard{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:28px 16px calc(28px + env(safe-area-inset-bottom));
}
.onboard-card{width:100%;max-width:440px}
.onboard-logo{
  width:66px;height:66px;border-radius:20px;margin:0 auto 14px;
  background:linear-gradient(140deg,var(--accent),#a06cff 70%);
  display:grid;place-items:center;font-size:32px;
  box-shadow:0 20px 45px -20px var(--accent);
}
.onboard h1{text-align:center;font-size:24px;letter-spacing:-.6px}
.onboard p.sub{text-align:center;color:var(--muted);font-size:13.5px;margin:6px 0 20px}
.photo-pick{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:18px}
.photo-ring{
  width:104px;height:104px;border-radius:50%;overflow:hidden;
  border:2px dashed var(--line-2);background:var(--x0d1521);
  display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;
}
.photo-ring img{width:100%;height:100%;object-fit:cover;display:block}
.photo-ring.has{border-style:solid;border-color:var(--accent)}

/* ---------- formulários ---------- */
.field{margin-bottom:13px}
.field > label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
.input,textarea.input,select.input{
  width:100%;min-height:48px;padding:12px 13px;border-radius:12px;
  background:var(--x0a111b);border:1.4px solid var(--line-2);color:var(--txt);
  outline:none;transition:border-color .15s ease, box-shadow .15s ease;
}
textarea.input{min-height:86px;resize:vertical;line-height:1.45}
.input:focus,textarea.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,140,255,.15)}
.input::placeholder{color:var(--x5b6c85)}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.info-box{
  font-size:12px;color:var(--muted);line-height:1.6;
  background:var(--x0a111b);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:8px;
}
.info-box b{color:var(--txt)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- rodapé fixo: abas de concursos + navegação ---------- */
#footer{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(to top, var(--nav-a) 40%, var(--nav-b));
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#strip{
  max-width:760px;margin:0 auto;padding:8px 12px 0;
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
}
#strip::-webkit-scrollbar{display:none}
.ctab{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:99px;font-size:12px;font-weight:650;
  border:1px solid var(--line-2);background:var(--x0d1521);color:var(--muted);white-space:nowrap;
  max-width:190px;
}
.ctab span{overflow:hidden;text-overflow:ellipsis;max-width:130px}
.ctab.on{background:rgba(108,140,255,.16);border-color:var(--accent);color:var(--xd5deff)}
.ctab.add{border-style:dashed;color:var(--accent);font-weight:800}
#bottomNav{
  max-width:760px;margin:0 auto;padding:4px 6px 0;
  display:grid;grid-template-columns:repeat(6,1fr);align-items:stretch;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:52px;border-radius:12px;font-size:9.5px;font-weight:700;letter-spacing:.01em;
  color:var(--x71809a);padding:6px 1px 8px;
}
.nav-btn .ic{font-size:18px;line-height:1;filter:grayscale(1) opacity(.75)}
.nav-btn.on{color:var(--txt)}
.nav-btn.on .ic{filter:none}

/* ---------- modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:90;display:none}
#modalRoot.open{display:block}
#exemploRoot{position:fixed;inset:0;z-index:120;display:none}
#exemploRoot.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(3,6,11,.72);backdrop-filter:blur(4px)}
.modal{
  position:absolute;left:0;right:0;bottom:0;
  max-height:92vh;overflow-y:auto;
  background:linear-gradient(180deg,var(--card),var(--x0c131f));
  border:1px solid var(--line-2);border-bottom:0;
  border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  animation:slideUp .22s ease;
  max-width:760px;margin:0 auto;
}
@keyframes slideUp{from{transform:translateY(22px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-head h3{font-size:16.5px;font-weight:750;flex:1}
.modal-foot{display:flex;gap:8px;margin-top:16px}
.modal-foot .btn{flex:1}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 74px);transform:translate(-50%,14px);
  background:var(--x1b2739);border:1px solid var(--line-2);color:var(--txt);
  padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:120;
  max-width:86vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- prática: definições e cards ---------- */
.practice-stage{
  background:linear-gradient(180deg,var(--x101a29),var(--x0b1320));
  border:1px solid var(--line-2);border-radius:18px;padding:18px;
  min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:12px;
}
.qterm{font-size:20px;font-weight:750;letter-spacing:-.3px;line-height:1.3}
.qdef{
  font-size:15px;line-height:1.6;color:var(--xc9d6ea);
  border-top:1px solid var(--line);padding-top:12px;
  white-space:pre-wrap;
}
.flip{perspective:1200px;cursor:pointer;min-height:230px}
.flip-in{position:relative;transition:transform .45s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;min-height:230px}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:20px;text-align:center;border-radius:18px;
}
.face.front{background:linear-gradient(160deg,var(--x131f32),var(--x0b1320));border:1px solid var(--line-2)}
.face.back{background:linear-gradient(160deg,rgba(34,211,166,.14),var(--x0b1320));border:1px solid var(--x1c6b58);transform:rotateY(180deg)}
.face .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800}
.face .big-t{font-size:19px;font-weight:750;line-height:1.35;white-space:pre-wrap}

/* ---------- caça-palavras ---------- */
.ws-grid{
  display:grid;gap:2px;margin:0 auto;width:100%;max-width:440px;
  background:var(--x0a111b);border:1px solid var(--line-2);border-radius:14px;padding:6px;
  touch-action:manipulation;
}
.ws-cell{
  aspect-ratio:1/1;display:grid;place-items:center;
  font-size:clamp(9px,2.6vw,15px);font-weight:700;color:var(--xb9c8dd);
  border-radius:5px;background:var(--x0f1927);border:1px solid transparent;
  transition:background .12s ease,color .12s ease;
}
.ws-cell.sel{background:rgba(108,140,255,.28);border-color:var(--accent);color:#fff}
.ws-cell.found{background:rgba(34,197,94,.22);border-color:var(--x2c8f5e);color:var(--xc6ffdc)}
.ws-cell.hint{background:rgba(234,179,8,.18);border-color:var(--x8a7216);color:var(--xffe9a3)}
.ws-words{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ws-word{
  font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:5px 9px;border-radius:8px;
  background:var(--x0d1521);border:1px solid var(--line-2);color:var(--muted);
}
.ws-word.done{background:rgba(34,197,94,.14);border-color:var(--x1f6a41);color:var(--x8ff0b3);text-decoration:line-through}

/* ---------- utilidades de layout ---------- */
.sec{margin-top:14px}
.spacer{height:8px}
.fab-row{display:flex;gap:8px;margin-top:12px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.divider{height:1px;background:var(--line);margin:14px 0}

@media(min-width:560px){
  .hours-grid{grid-template-columns:repeat(4,1fr)}
  .countdown .big{font-size:60px}
}
@media(max-width:360px){
  .brand-txt span{max-width:110px}
  .nav-btn{font-size:9px}
}

/* ---------- plano de estudo (semáforo) ---------- */
.plan{margin-top:12px;border:1px solid var(--line-2);border-radius:12px;padding:12px;background:var(--x0d1521)}
.plan .plan-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan .pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.plan .plan-t{font-size:15px;font-weight:700;margin-top:8px;line-height:1.35}
.plan .plan-d{font-size:13px;margin-top:6px;line-height:1.45}
.plan.g{background:rgba(34,197,94,.10);border-color:var(--x1f6a41)}.plan.g .pill,.plan.g .plan-t b{color:var(--x8ff0b3)}
.plan.y{background:rgba(234,179,8,.10);border-color:var(--x7a6518)}.plan.y .pill,.plan.y .plan-t b{color:var(--xffe07a)}
.plan.r{background:rgba(239,68,68,.12);border-color:var(--x7a2630)}.plan.r .pill,.plan.r .plan-t b{color:var(--xff9c9c)}
.selbar{position:sticky;top:8px;z-index:6;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;margin-bottom:10px;background:var(--card-2);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.item.selectable{cursor:pointer}
.item.selectable.picked{border-color:var(--x7a2430);background:rgba(239,68,68,.08)}
.item.selectable .check{pointer-events:none}
.item.selectable.picked .check{background:#ef4444;border-color:#ef4444;color:#fff}

    <button type="button" class="btn ghost block" style="margin-top:12px" data-act="cloudLogin">☁️ Já tenho conta — entrar</button>
  </div>
</div>

<div id="modalRoot"></div>
<div id="exemploRoot"></div>
<div id="toast"></div>

<script>
/* ==================================================================
   HELPESTUDO v1.0
   App de estudos para concursos: perfil, concursos, matérias,
   conteúdos, horas, dificuldade e práticas (definições, cards,
   caça-palavras). Tudo salvo no localStorage do aparelho.
   ================================================================== */

/* ---------- constantes ---------- */
const STORAGE_KEY = "helpestudo_v1";
const APP_VERSION = "2.2";
const DIFFS = [
  { v: 0, label: "Muito difícil" },
  { v: 3, label: "Difícil" },
  { v: 4, label: "Média" },
  { v: 5, label: "Fácil" }
];
const SUBJECT_COLORS = ["#6c8cff","#22d3a6","#f97316","#e879f9","#38bdf8","#f43f5e","#a3e635","#fbbf24"];
const SUBJECT_SUGGESTIONS = ["Português","Matemática","Raciocínio Lógico","Informática","Direito Constitucional","Direito Administrativo","Legislação","Atualidades","Direito Penal","Direito Processual Penal"];

/* dias da semana na ordem que aparece na agenda (segunda primeiro) */
const DAYS = [
  { n:1, long:"Segunda-feira", short:"Seg" },
  { n:2, long:"Terça-feira",   short:"Ter" },
  { n:3, long:"Quarta-feira",  short:"Qua" },
  { n:4, long:"Quinta-feira",  short:"Qui" },
  { n:5, long:"Sexta-feira",   short:"Sex" },
  { n:6, long:"Sábado",        short:"Sáb" },
  { n:0, long:"Domingo",       short:"Dom" }
];
const ROMAN = ["I","II","III","IV"];

function dayName(n, short){
  const d = DAYS.find(x=>x.n === Number(n));
  return d ? (short ? d.short : d.long) : "—";
}
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}
/* descobre o dia da semana a partir do texto do JSON importado */
function dayFromText(txt){
  const t = norm(txt);
  if(!t) return null;
  if(t.includes("seg")) return 1;
  if(t.includes("ter")) return 2;
  if(t.includes("qua")) return 3;
  if(t.includes("qui")) return 4;
  if(t.includes("sex")) return 5;
  if(t.includes("sab")) return 6;
  if(t.includes("dom")) return 0;
  return null;
}
/* "19:00 - 20:00" -> 60 minutos */
function minutosDoHorario(h){
  const m = String(h||"").match(/(\d{1,2})[:h](\d{2})?/g);
  if(!m || m.length < 2) return 0;
  const toMin = x => { const p = x.split(/[:h]/); return (Number(p[0])||0)*60 + (Number(p[1])||0); };
  const ini = toMin(m[0]), fim = toMin(m[1]);
  const d = fim - ini;
  return d > 0 && d <= 12*60 ? d : 0;
}
/* conteúdo que precisa de revisão: dificuldade marcada abaixo do verde */
/* quanto tempo sem mexer no conteúdo (para o aviso de revisão) */
function revisaoDe(t){
  if(!t) return null;
  const base = t.lastDone || t.lastVisit;
  if(!base) return null;
  const d = parseLocalDate(base);
  if(!d) return null;
  const dias = Math.floor((Date.now() - d.getTime()) / 86400000);
  if(dias >= 30) return { dias, nivel:"vermelho", titulo:"Revise esse conteúdo", txt:"Faz " + dias + " dias que você não mexe aqui. Releia e faça questões para não se esquecer." };
  if(dias >= 12) return { dias, nivel:"laranja", titulo:"Vale uma leve revisada", txt:"Faz " + dias + " dias desde a última vez. Uma passada rápida resolve." };
  return null;
}

function needsReview(t){
  return (t.difficulty === 0 || t.difficulty) && Number(t.difficulty) < 5;
}

/* ---------- armazenamento ----------
   Em navegador normal usa localStorage. Se estiver bloqueado
   (modo privado / prévia), cai para memória e o app continua rodando. */
const store = (()=>{
  try{
    const k = "__he_test__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    return window.localStorage;
  }catch(e){
    const mem = {};
    return {
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k,v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; }
    };
  }
})();

/* ---------- estado global ---------- */
let db = null;             // dados persistidos
let ui = {
  tab: "home",
  cid: null,               // concurso aberto
  sid: null,               // matéria aberta
  tid: null,               // conteúdo aberto
  practice: null,          // {type, tid, index, revealed, flipped, hits, misses}
  psub: null,              // matéria aberta na aba Praticar
  ws: { start: null, sel: [] },
  sel: null,               // modo apagar vários: {kind:"subjects"|"topics", sid, ids:[]}
  qlist: null,             // id do conteúdo com a lista de questões aberta
  tmpPhoto: ""
};

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function pad(n){ return String(n).padStart(2,"0"); }
function todayISO(){ const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseLocalDate(iso){
  if(!iso) return null;
  const p = String(iso).split("-").map(Number);
  if(p.length < 3 || !p[0]) return null;
  return new Date(p[0], p[1]-1, p[2]);
}
function daysUntil(iso){
  const target = parseLocalDate(iso);
  if(!target) return null;
  const n = new Date();
  const hoje = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((target - hoje) / 86400000);
}
function dateBR(iso){
  const d = parseLocalDate(iso);
  if(!d) return "";
  return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();
}
function fmtMin(min){
  min = Math.max(0, Math.round(Number(min) || 0));
  if(min < 60) return min + "min";
  const h = Math.floor(min/60), m = min%60;
  return m ? h+"h "+m+"min" : h+"h";
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("on"), 2200);
}
function photoURL(){
  return db && db.profile && db.profile.photo ? db.profile.photo : "";
}
function initials(){
  const n = (db && db.profile && db.profile.name) || "?";
  return n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
}
function idade(){
  const d = parseLocalDate(db?.profile?.birthDate);
  if(!d) return null;
  const n = new Date();
  let a = n.getFullYear()-d.getFullYear();
  const m = n.getMonth()-d.getMonth();
  if(m < 0 || (m === 0 && n.getDate() < d.getDate())) a--;
  return a >= 0 && a < 130 ? a : null;
}

/* ==================================================================
   PERSISTÊNCIA
   ================================================================== */
function newDB(){
  return {
    version: 1,
    createdAt: new Date().toISOString(),
    profile: { name:"", photo:"", birthDate:"" },
    concursos: [],
    log: [],          // {id, cid, sid, tid, minutes, date, note}
    activeId: null
  };
}

function normalize(d){
  const base = newDB();
  if(!d || typeof d !== "object") return base;
  const out = Object.assign(base, d);
  out.profile = Object.assign(base.profile, d.profile || {});
  out.concursos = Array.isArray(d.concursos) ? d.concursos : [];
  out.log = Array.isArray(d.log) ? d.log : [];

  // garante que cada concurso/matéria/conteúdo tenha tudo que o app usa
  out.concursos.forEach(c=>{
    c.id = c.id || uid();
    c.name = c.name || "Concurso sem nome";
    c.subjects = Array.isArray(c.subjects) ? c.subjects : [];
    c.hoursTarget = Number(c.hoursTarget) || 0;
    c.dailyHours = Number(c.dailyHours) || 0;
    c.subjects.forEach((s,i)=>{
      s.id = s.id || uid();
      s.name = s.name || "Matéria";
      s.color = s.color || SUBJECT_COLORS[i % SUBJECT_COLORS.length];
      s.topics = Array.isArray(s.topics) ? s.topics : [];
      s.topics.forEach(t=>{
        t.id = t.id || uid();
        t.name = t.name || "Conteúdo";
        t.done = !!t.done;
        t.difficulty = (t.difficulty === 0 || t.difficulty) ? Number(t.difficulty) : null;
        t.definitions = Array.isArray(t.definitions) ? t.definitions : [];
        t.cards = Array.isArray(t.cards) ? t.cards : [];
        t.questions = Array.isArray(t.questions)
          ? t.questions.map(q=>({
              id: q.id || uid(),
              text: q.text || "",
              options: Array.isArray(q.options) ? q.options.map(o=>String(o)) : [],
              correct: Number(q.correct) || 0,
              comment: q.comment || ""
            })).filter(q=>q.text && q.options.length >= 2)
          : [];
        t.ws = t.ws && Array.isArray(t.ws.grid) ? t.ws : null;
        t.notes = typeof t.notes === "string" ? t.notes : "";
        t.links = Array.isArray(t.links)
          ? t.links.map(l=>({ id: l.id || uid(), title: String(l.title||""), url: String(l.url||""), image: String(l.image||"") })).filter(l=>l.url)
          : [];
        t.pdfs = Array.isArray(t.pdfs)
          ? t.pdfs.map(f=>({ id: f.id || uid(), name: String(f.name||"ebook.pdf"), size: Number(f.size)||0 }))
          : [];
      });
    });
  });

  // agenda: sempre 7 dias, com os blocos normalizados
  out.concursos.forEach(c=>{
    const dias = (c.schedule && Array.isArray(c.schedule.days)) ? c.schedule.days : null;
    const novo = DAYS.map(d=>{
      const achado = dias ? dias.find(x=>Number(x.dia) === d.n) : null;
      const blocks = achado && Array.isArray(achado.blocks) ? achado.blocks : [];
      return {
        dia: d.n,
        cargaHoras: Number(achado && achado.cargaHoras) || 0,
        observacao: (achado && achado.observacao) || "",
        blocks: blocks.map(b=>({
          id: b.id || uid(),
          horario: b.horario || "",
          minutos: Number(b.minutos) || minutosDoHorario(b.horario) || 0,
          disciplina: b.disciplina || "",
          foco: b.foco || "",
          metodologia: b.metodologia || ""
        }))
      };
    });
    c.schedule = {
      days: novo,
      meta: (c.schedule && c.schedule.meta) || {},
      importedAt: (c.schedule && c.schedule.importedAt) || null
    };
  });
  return out;
}

function loadDB(){
  try{
    const raw = store.getItem(STORAGE_KEY);
    if(!raw) return null;
    return normalize(JSON.parse(raw));
  }catch(e){
    console.warn("Falha ao ler dados", e);
    return null;
  }
}

function saveDB(){
  try{
    store.setItem(STORAGE_KEY, JSON.stringify(db));
    try{ cloudMarkDirty(); }catch(e){}
    return true;
  }catch(e){
    console.error(e);
    toast("Não consegui salvar. Armazenamento cheio?");
    return false;
  }
}

/* ==================================================================
   CONSULTAS E CÁLCULOS
   ================================================================== */
function concursoAtual(){
  if(!db) return null;
  return db.concursos.find(c => c.id === ui.cid) || db.concursos[0] || null;
}
function minutesOf(cid, sid, tid){
  return db.log.reduce((sum, l)=>{
    if(l.cid !== cid) return sum;
    if(sid && l.sid !== sid) return sum;
    if(tid && l.tid !== tid) return sum;
    return sum + (Number(l.minutes) || 0);
  }, 0);
}
function subjectMinutes(c, sid){
  // soma tudo da matéria (inclui horas lançadas direto na matéria e nos conteúdos)
  return minutesOf(c.id, sid);
}
function stats(c){
  const minutes = minutesOf(c.id);
  const target = Math.max(0, Number(c.hoursTarget) || 0) * 60;
  const remaining = Math.max(0, target - minutes);
  const days = daysUntil(c.examDate);
  const perDay = days != null && days > 0 ? Math.ceil(remaining / days) : remaining;
  const pct = target > 0 ? Math.min(100, (minutes / target) * 100) : 0;
  const topics = c.subjects.reduce((a,s)=>a.concat(s.topics), []);
  return {
    minutes, target, remaining, days, perDay, pct,
    topicsTotal: topics.length,
    topicsDone: topics.filter(t=>t.done).length
  };
}
function diffLabel(v){
  const d = DIFFS.find(x=>x.v === Number(v));
  return d ? d.label : "Sem nota";
}
function avgDiff(subject){
  const vals = subject.topics.filter(t=>t.difficulty === 0 || t.difficulty).map(t=>Number(t.difficulty));
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

/* ==================================================================
   NAVEGAÇÃO
   ================================================================== */
function go(tab, opts={}){
  ui.tab = tab;
  if(opts.cid !== undefined) ui.cid = opts.cid;
  if(opts.sid !== undefined) ui.sid = opts.sid;
  if(opts.tid !== undefined) ui.tid = opts.tid;
  ui.practice = null;                        // tocar numa aba sempre sai do treino
  ui.sel = null;
  if(tab !== "practice") ui.psub = null;
  ui.qlist = null;     // e volta para a lista de matérias
  ui.ws = { start:null, sel:[] };
  window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
  render();
}

function selectConcurso(cid){
  ui.cid = cid;
  if(db) { db.activeId = cid; saveDB(); }
  ui.sid = null; ui.tid = null;
  ui.tab = "home";
  render();
}

/* ==================================================================
   RENDER PRINCIPAL
   ================================================================== */
function render(){
  if(!db || !db.profile || !db.profile.name){
    document.getElementById("onboarding").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
    return;
  }
  document.getElementById("onboarding").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  // concurso ativo: o último aberto
  if(!concursoAtual() && db.concursos.length){
    ui.cid = db.activeId || db.concursos[0].id;
  }
  renderTopbar();
  renderStrip();
  renderView();
  renderNav();
}

function renderTopbar(){
  const c = concursoAtual();
  const sub = document.getElementById("brandSub");
  sub.textContent = c ? c.name : "Nenhum concurso ainda";
  syncThemeBtn();
  const av = document.getElementById("topAvatar");
  av.innerHTML = photoURL()
    ? '<img src="'+photoURL()+'" alt="foto">'
    : esc(initials());
}

function renderNav(){
  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.classList.toggle("on", b.dataset.tab === ui.tab);
  });
}

function renderStrip(){
  const strip = document.getElementById("strip");
  if(!db.concursos.length){ strip.innerHTML = ""; return; }
  strip.innerHTML = db.concursos.map(c=>{
    const on = c.id === (concursoAtual()||{}).id ? " on" : "";
    return '<button class="ctab'+on+'" data-act="openConcurso" data-cid="'+c.id+'"><span>'+esc(c.name)+'</span></button>';
  }).join("") + '<button class="ctab add" data-act="newConcurso">+ novo</button>';
}

function renderView(){
  const v = document.getElementById("view");
  const c = concursoAtual();
  switch(ui.tab){
    case "home":      v.innerHTML = viewHome(c); break;
    case "agenda":    v.innerHTML = viewAgenda(c); break;
    case "rotina":    v.innerHTML = viewRotina(c); break;
    case "subjects":  v.innerHTML = viewSubjects(c); break;
    case "subject":   v.innerHTML = viewSubject(c); break;
    case "topic":     v.innerHTML = viewTopic(c); break;
    case "practice":  v.innerHTML = viewPractice(c); break;
    case "concursos": v.innerHTML = viewConcursos(); break;
    case "dados":     v.innerHTML = viewDados(); break;
    default:          v.innerHTML = viewHome(c);
  }
}

/* ==================================================================
   TELA: INÍCIO
   ================================================================== */
function viewHome(c){
  if(!c){
    return `
      <div class="page-head"><h2>Início</h2></div>
      <div class="card">
        <div class="empty">
          <b>Vamos criar seu primeiro concurso</b>
          Dá um nome (ex: Polícia Militar da Bahia), a data da prova e a meta de horas.
        </div>
        <button class="btn primary block" style="margin-top:12px" data-act="newConcurso">+ Criar concurso</button>
      </div>`;
  }

  const st = stats(c);
  let cdClass = "countdown", cdBig = "", cdLbl = "";
  if(st.days == null){
    cdClass += ""; cdBig = "—"; cdLbl = "Defina a data da prova";
  } else if(st.days > 1){
    cdClass += st.days <= 30 ? " hot" : "";
    cdBig = st.days; cdLbl = "dias para sua prova";
  } else if(st.days === 1){
    cdClass += " hot"; cdBig = "1"; cdLbl = "dia para sua prova";
  } else if(st.days === 0){
    cdClass += " today"; cdBig = "0"; cdLbl = "É hoje. Boa prova! 🍀";
  } else {
    cdBig = "—"; cdLbl = "Prova já realizada em " + dateBR(c.examDate);
  }

  const meta = Number(c.hoursTarget) || 0;
  // texto do cálculo: só faz sentido falar de "por dia" quando ainda há prazo
  let perDayTxt;
  if(st.remaining <= 0) perDayTxt = "Meta batida! 🎉 Você já estudou tudo o que planejou.";
  else if(st.days == null) perDayTxt = "Defina a data da prova para calcular quanto precisa por dia.";
  else if(st.days > 0) perDayTxt = "Para atingir você precisa de <b>"+fmtMin(st.perDay)+" por dia</b>.";
  else if(st.days === 0) perDayTxt = "É hoje! Faltam <b>"+fmtMin(st.remaining)+"</b> para bater a sua meta.";
  else perDayTxt = "A prova já passou. Ficaram <b>"+fmtMin(st.remaining)+"</b> para a meta.";
  const perDayCell = (st.days != null && st.days > 0 && st.remaining > 0) ? fmtMin(st.perDay) : "—";

  const subjRows = c.subjects.length
    ? '<div class="list">' + c.subjects.map(s=>{
        const tot = s.topics.length, done = s.topics.filter(t=>t.done).length;
        const hrs = fmtMin(subjectMinutes(c, s.id));
        const ad = avgDiff(s);
        const badge = ad == null ? "" : '<span class="badge d'+roundDiff(ad)+'">'+diffLabel(roundDiff(ad))+'</span>';
        const rev = s.topics.filter(t=>needsReview(t)).length;
        const revBadge = rev ? '<span class="badge rev">⚠️ '+rev+'</span>' : "";
        return `<button class="item" data-act="openSubject" data-sid="${s.id}">
          <span class="dot" style="background:${s.color}"></span>
          <span class="txt"><b>${esc(s.name)}</b><span>${done}/${tot} conteúdos · ${hrs}</span></span>
          <span class="right">${revBadge}${badge}<span class="chev">›</span></span>
        </button>`;
      }).join("") + "</div>"
    : '<div class="empty"><b>Nenhuma matéria ainda</b>Adicione Português, Informática, Legislação...</div>';

  // ---- agenda de hoje ----
  const sch = c.schedule;
  const hojeN = new Date().getDay();
  const diaHoje = sch ? (sch.days || []).find(d=>d.dia === hojeN) : null;
  const blocosHoje = diaHoje ? diaHoje.blocks : [];
  const semanaMin = sch ? (sch.days||[]).reduce((a,d)=>a+d.blocks.reduce((x,b)=>x+(Number(b.minutos)||0),0),0) : 0;
  const temAgenda = !!(sch && (sch.days||[]).some(d=>d.blocks.length));
  const agendaCard = `
    <div class="card">
      <div class="card-title"><h3>🗓️ Calendário de estudos</h3><span class="sp"></span>
        <button class="btn xs" data-act="setTab" data-tab="agenda">${temAgenda ? "Abrir" : "Montar"}</button>
      </div>
      ${temAgenda
        ? `<div class="eyebrow">Hoje · ${dayName(hojeN)}</div>
           ${blocosHoje.length
             ? '<div style="margin-top:8px">' + blocosHoje.slice(0,4).map(b=>{
                 const sub = c.subjects.find(x=>norm(x.name) === norm(b.disciplina));
                 return `<div class="blk" style="padding:9px 10px">
                   <div class="hr">${esc(b.horario || fmtMin(b.minutos))}</div>
                   <div class="info"><b><span class="dot-sub" style="background:${sub?sub.color:"var(--line-2)"}"></span>${esc(b.disciplina || "Estudo")}</b>
                     ${b.foco ? `<div class="foco">${esc(b.foco)}</div>` : ""}</div>
                 </div>`;
               }).join("") + (blocosHoje.length > 4 ? `<p class="tiny muted" style="margin-top:8px">+${blocosHoje.length-4} bloco(s) hoje</p>` : "") + "</div>"
             : `<p class="small muted" style="margin-top:6px">Hoje é ${dayName(hojeN)} e não tem bloco marcado. Bom dia para revisar o que está em vermelho.</p>`}
           <div class="progress-label" style="margin-top:10px"><span>${fmtMin(semanaMin)} na semana</span><span>${(sch.days||[]).filter(d=>d.blocks.length).length} dias com estudo</span></div>`
        : `<p class="small muted">Monte os horários de cada matéria na semana ou importe um cronograma pronto em JSON.</p>
           <div class="row" style="margin-top:10px">
             <button class="btn sm grow" data-act="setTab" data-tab="agenda">Montar semana</button>
             <button class="btn sm" data-act="importSchedule">📥 Importar JSON</button>
           </div>`}
    </div>`;


  // ---- rotina (card com gráfico de pesos) ----
  const rotR = c.rotina;
  const rotCfg = rotR && rotR.config;
  const rotSlots = (rotR && rotR.slots) || [];
  const rotPesosMap = rotPesos(c, rotCfg || rotinaConfigPadrao(c));
  const rotMax = Math.max(1, ...c.subjects.map(s=>Number(rotPesosMap[s.id]) || 0));
  const rotSoma = c.subjects.reduce((a,s)=> a + (Number(rotPesosMap[s.id]) || 0), 0);
  const rotChart = c.subjects.length
    ? c.subjects.map(s=>{
        const p = Number(rotPesosMap[s.id]) || 0;
        const w = rotSoma ? Math.max(5, (p / rotMax) * 100) : 5;
        return `<div class="rot-bar"><b>${esc(s.name)}</b><span class="num">${p ? p + " q." : "—"}</span>
          <span class="track"><i style="width:${w}%;background:${s.color}"></i></span></div>`;
      }).join("")
    : `<p class="small muted">Cadastre matérias para ver o gráfico.</p>`;
  const rotFeitas = rotSlots.filter(s=>rotFeito(c, s)).length;
  const rotCard = `
    <div class="card">
      <div class="card-title"><h3>📊 Rotina de estudos</h3><span class="sp"></span>
        <button class="btn xs" data-act="openRotina">${rotSlots.length ? "Abrir" : "Montar"}</button>
      </div>
      <p class="hint" style="margin-bottom:10px">${rotSoma ? "O peso de cada matéria vem do número de questões." : "Informe quantas questões caem de cada matéria e eu monto a semana."}</p>
      <div class="rot-chart">${rotChart}</div>
      ${rotSlots.length
        ? `<div class="progress-label" style="margin-top:12px"><span>${rotSlots.length} aula${rotSlots.length===1?"":"s"} na semana</span><span>${rotFeitas} feita${rotFeitas===1?"":"s"}</span></div>
           <div class="progress"><i style="width:${Math.round(rotFeitas/rotSlots.length*100)}%"></i></div>`
        : `<button class="btn sm block" style="margin-top:12px" data-act="openRotina">Montar minha rotina</button>`}
    </div>`;

  return `
    <div class="page-head"><h2>Início</h2><span class="sp grow"></span>
      <button class="btn xs ghost" data-act="editConcurso" data-cid="${c.id}">⚙️</button>
    </div>

    <div class="card hero">
      <div class="eyebrow">Seu concurso</div>
      <h1 style="font-size:21px;letter-spacing:-.4px;margin-top:4px">${esc(c.name)}</h1>
      <div class="${cdClass}">
        <span class="big">${cdBig}</span>
        <span class="unit">${cdLbl}</span>
      </div>
      <div class="hero-date">${c.examDate ? "Prova em " + dateBR(c.examDate) : "Sem data definida"}</div>
    </div>

    <div class="card">
      <div class="card-title"><h3>⏱️ Horas de estudo</h3><span class="sp"></span>
        <button class="btn xs ghost" data-act="editMeta" data-cid="${c.id}" title="Editar tempo necessário" aria-label="Editar tempo necessário">✏️</button>
        <button class="btn xs" data-act="openHours" data-cid="${c.id}">+ Registrar</button>
      </div>
      <div class="hours-grid">
        <div class="stat"><div class="k">Tempo necessário</div><div class="v">${meta}h</div></div>
        <div class="stat"><div class="k">Estudadas</div><div class="v">${fmtMin(st.minutes)}</div></div>
        <div class="stat"><div class="k">Restantes</div><div class="v">${fmtMin(st.remaining)}</div></div>
        <div class="stat"><div class="k">Por dia</div><div class="v">${perDayCell}</div></div>
      </div>
      <div class="progress"><i style="width:${st.pct.toFixed(1)}%"></i></div>
      <div class="progress-label">
        <span>${Math.round(st.pct)}% do tempo necessário</span>
        <span>${st.topicsDone}/${st.topicsTotal} conteúdos concluídos</span>
      </div>
      <div class="callout">${perDayTxt}</div>
      ${planoHtml(c)}
    </div>

    ${rotCard}

    ${agendaCard}

    <div class="card">
      <div class="card-title"><h3>📖 Matérias</h3><span class="sp"></span>
        <button class="btn xs ghost" data-act="importSubjects" data-cid="${c.id}" title="Importar matérias">📥</button>
        <button class="btn xs" data-act="newSubject" data-cid="${c.id}">+ Matéria</button>
      </div>
      ${subjRows}
    </div>

    <div class="card">
      <div class="card-title"><h3>⚡ Atalhos</h3></div>
      <div class="row wrap">
        <button class="btn sm" data-act="openHours" data-cid="${c.id}">⏱️ Estudar agora</button>
        <button class="btn sm" data-act="setTab" data-tab="practice">🎯 Praticar</button>
        <button class="btn sm" data-act="newConcurso">+ Concurso</button>
      </div>
    </div>
  `;
}
function roundDiff(ad){
  if(ad <= 1.5) return 0;
  if(ad <= 3.5) return 3;
  if(ad <= 4.5) return 4;
  return 5;
}

/* ---------- setas ↑ ↓ para mudar a ordem ---------- */
function mvHtml(kind, id, i, n, sid){
  if(n < 2) return "";
  const at = `data-act="moveItem" data-kind="${kind}" data-id="${id}" ${sid ? 'data-sid="'+sid+'"' : ""}`;
  const up = i > 0 ? `<button class="mv" ${at} data-dir="-1" title="Subir" aria-label="Subir">↑</button>` : `<span class="mv ph"></span>`;
  const dn = i < n-1 ? `<button class="mv" ${at} data-dir="1" title="Descer" aria-label="Descer">↓</button>` : `<span class="mv ph"></span>`;
  return `<span class="mvcol">${up}${dn}</span>`;
}

/* ---------- modo "apagar vários" (matérias e conteúdos) ---------- */
function selAtivo(kind, sid){
  return !!(ui.sel && ui.sel.kind === kind && (kind === "subjects" || ui.sel.sid === sid));
}
function selBarHtml(total){
  const n = ui.sel.ids.length;
  return `<div class="selbar">
    <button class="btn xs ghost" data-act="selAll">${n === total && total ? "Limpar" : "Selecionar tudo"}</button>
    <span class="grow small muted">${n} selecionado${n===1?"":"s"}</span>
    <button class="btn xs ghost" data-act="selCancel">Cancelar</button>
    <button class="btn xs danger" data-act="selDelete" ${n ? "" : "disabled"}>🗑️ Apagar${n ? " ("+n+")" : ""}</button>
  </div>`;
}

function viewSubjects(c){
  if(!c){
    return `<div class="page-head"><h2>Matérias</h2></div>
      <div class="card"><div class="empty"><b>Comece pelo concurso</b>Crie um concurso para adicionar matérias.</div>
      <button class="btn primary block" style="margin-top:12px" data-act="newConcurso">+ Criar concurso</button></div>`;
  }
  const selOn = selAtivo("subjects");
  const list = c.subjects.length
    ? '<div class="list">' + c.subjects.map((s,si)=>{
        const tot = s.topics.length, done = s.topics.filter(t=>t.done).length;
        const pct = tot ? Math.round(done/tot*100) : 0;
        if(selOn){
          const on = ui.sel.ids.includes(s.id);
          return `<div class="item selectable ${on?"picked":""}" data-act="selToggle" data-id="${s.id}">
            <button class="check ${on?"on":""}" tabindex="-1" aria-label="Selecionar">✓</button>
            <span class="dot" style="background:${s.color}"></span>
            <span class="txt"><b>${esc(s.name)}</b>
              <span>${tot} conteúdo${tot===1?"":"s"} · ${done} concluído${done===1?"":"s"}</span>
            </span>
          </div>`;
        }
        return `<div class="item" data-act="openSubject" data-sid="${s.id}">
          <span class="dot" style="background:${s.color}"></span>
          <span class="txt"><b>${esc(s.name)}</b>
            <span>${tot} conteúdo${tot===1?"":"s"} · ${done} concluído${done===1?"":"s"} · ${fmtMin(subjectMinutes(c,s.id))}</span>
          </span>
          <span class="right">
            <button class="btn xs ghost" data-act="renameSubject" data-sid="${s.id}" title="Editar nome da matéria" aria-label="Editar nome da matéria">✏️</button>
            <span class="badge">${pct}%</span>
          </span>
          ${mvHtml("subjects", s.id, si, c.subjects.length)}
        </div>`;
      }).join("") + "</div>"
    : '<div class="empty"><b>Nenhuma matéria ainda</b>Toque em "+ Matéria" e escolha uma sugestão.</div>';

  return `
    <div class="page-head"><h2>Matérias</h2><span class="sp grow"></span>
      <button class="btn xs ghost" data-act="importSubjects" data-cid="${c.id}" title="Importar matérias">📥</button>
      ${c.subjects.length ? `<button class="btn xs ghost" data-act="pdfMaterias" title="Gerar PDF das matérias" aria-label="Gerar PDF das matérias">📄</button>` : ""}
      ${c.subjects.length ? `<button class="btn xs ghost" data-act="selStart" data-kind="subjects" title="Apagar várias matérias" aria-label="Apagar várias matérias">🗑️</button>` : ""}
      <button class="btn xs" data-act="newSubject" data-cid="${c.id}">+ Matéria</button>
    </div>
    <p class="muted small" style="margin-bottom:12px">${esc(c.name)}</p>
    ${selOn ? selBarHtml(c.subjects.length) : ""}
    ${list}
  `;
}

/* ==================================================================
   TELA: MATÉRIA (conteúdos)
   ================================================================== */
function viewSubject(c){
  if(!c) return viewSubjects(c);
  const s = c.subjects.find(x=>x.id === ui.sid);
  if(!s){ ui.tab = "subjects"; return viewSubjects(c); }
  const hrs = fmtMin(subjectMinutes(c, s.id));
  const done = s.topics.filter(t=>t.done).length;
  const revisar = s.topics.filter(t=>needsReview(t));

  const selOn = selAtivo("topics", s.id);
  const topics = s.topics.length
    ? '<div class="list">' + s.topics.map((t,ti)=>{
        const mins = minutesOf(c.id, s.id, t.id);
        if(selOn){
          const on = ui.sel.ids.includes(t.id);
          return `<div class="item selectable ${on?"picked":""}" data-act="selToggle" data-id="${t.id}">
            <button class="check ${on?"on":""}" tabindex="-1" aria-label="Selecionar">✓</button>
            <span class="txt"><b>${esc(t.name)}</b><span>${mins ? fmtMin(mins) : "sem horas"}</span></span>
          </div>`;
        }
        const badge = (t.difficulty === 0 || t.difficulty)
          ? '<span class="badge d'+t.difficulty+'">'+diffLabel(t.difficulty)+'</span>' : "";
        const rev = needsReview(t) ? '<span class="badge rev">revisar</span>' : "";
        const velho = revisaoDe(t);
        const velhoBadge = velho ? `<span class="badge rev-${velho.nivel}" title="${esc(velho.txt)}">${velho.nivel === "vermelho" ? "🔴" : "🟠"}</span>` : "";
        const extras = [];
        if(t.definitions.length) extras.push("📝 "+t.definitions.length);
        if(t.cards.length) extras.push("🃏 "+t.cards.length);
        if((t.questions||[]).length) extras.push("❓ "+t.questions.length);
        if(t.ws) extras.push("🔎");
        if((t.links||[]).length) extras.push("🔗 "+t.links.length);
        if((t.pdfs||[]).length) extras.push("📕 "+t.pdfs.length);
        if((t.notes||"").trim()) extras.push("🗒️");
        return `<div class="item ${t.done?"done":""}">
          <button class="check ${t.done?"on":""}" data-act="toggleTopic" data-sid="${s.id}" data-tid="${t.id}">✓</button>
          <button class="txt" style="background:none;text-align:left;padding:0" data-act="openTopic" data-sid="${s.id}" data-tid="${t.id}">
            <b>${esc(t.name)}</b>
            <span>${mins ? fmtMin(mins) : "sem horas"}${extras.length ? " · " + extras.join(" ") : ""}</span>
          </button>
          <span class="right">${velhoBadge}${rev}${badge}
            <button class="btn xs ghost" data-act="renameTopic" data-sid="${s.id}" data-tid="${t.id}" title="Editar nome do conteúdo" aria-label="Editar nome do conteúdo">✏️</button>
          </span>
          ${mvHtml("topics", t.id, ti, s.topics.length, s.id)}
        </div>`;
      }).join("") + "</div>"
    : `<div class="empty"><b>Nenhum conteúdo nesta matéria</b>Ex: MSOffice, Crase, Lei 8.112...
        <button class="btn primary sm" style="margin-top:14px" data-act="newTopic" data-sid="${s.id}">+ Criar conteúdo</button>
      </div>`;

  return `
    <div class="page-head">
      <button class="back" data-act="setTab" data-tab="subjects">‹</button>
      <h2>${esc(s.name)}</h2>
      <span class="sp grow"></span>
      <button class="btn xs ghost" data-act="importTopics" data-sid="${s.id}" title="Importar conteúdos">📥</button>
      <button class="btn xs ghost" data-act="renameSubject" data-sid="${s.id}" title="Editar nome da matéria">✏️</button>
      <button class="btn xs ghost" data-act="delSubject" data-sid="${s.id}" title="Apagar matéria">🗑️</button>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><div class="eyebrow">Horas nesta matéria</div>
          <div style="font-size:22px;font-weight:750;letter-spacing:-.4px;margin-top:2px">${hrs}</div></div>
        <div style="text-align:right"><div class="eyebrow">Conteúdos</div>
          <div style="font-size:22px;font-weight:750;letter-spacing:-.4px;margin-top:2px">${done}/${s.topics.length}</div></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary sm grow" data-act="openHours" data-cid="${c.id}" data-sid="${s.id}">⏱️ Digitar horas estudadas</button>
        <button class="btn sm" data-act="newTopic" data-sid="${s.id}">+ Conteúdo</button>
      </div>
    </div>

    ${revisar.length ? `<div class="warn">
      <div class="wt"><b>⚠️ REVISAR ESSA MATÉRIA E PRATICAR!</b>
        <span>${revisar.length} conteúdo${revisar.length===1?"":"s"} com dificuldade entre I e III: ${esc(revisar.slice(0,3).map(t=>t.name).join(", "))}${revisar.length>3?"…":""}</span></div>
      <button class="btn xs" data-act="openTopic" data-sid="${s.id}" data-tid="${revisar[0].id}">Ver</button>
    </div>` : ""}

    <div class="sec">
      ${selOn ? selBarHtml(s.topics.length) : (s.topics.length ? `<div class="row" style="justify-content:flex-end;margin-bottom:8px">
        <button class="btn xs ghost" data-act="selStart" data-kind="topics" data-sid="${s.id}" title="Apagar vários conteúdos" aria-label="Apagar vários conteúdos">🗑️ Apagar vários</button>
      </div>` : "")}
      ${topics}
    </div>

    <div class="card" style="margin-top:12px">
      <div class="card-title"><h3>💡 Dica</h3></div>
      <p class="small muted">Marque a aula concluída, dê uma nota de dificuldade e registre as horas.
      Dentro de cada conteúdo você pode criar definições, cards e caça-palavras.</p>
    </div>
  `;
}

function currentTopic(){
  const c = concursoAtual(); if(!c) return { c:null, s:null, t:null };
  const s = c.subjects.find(x=>x.id === ui.sid);
  if(!s) return { c, s:null, t:null };
  const t = s.topics.find(x=>x.id === ui.tid);
  return { c, s, t };
}

function viewTopic(c){
  const s = c && c.subjects.find(x=>x.id === ui.sid);
  const t = s && s.topics.find(x=>x.id === ui.tid);
  if(!s || !t){ ui.tab = "subjects"; return viewSubjects(c); }
  const mins = minutesOf(c.id, s.id, t.id);
  const totalMin = minutesOf(c.id, s.id);

  const temNota = (t.difficulty === 0 || t.difficulty);
  // barrinhas: I vermelho · II laranja · III amarelo · IV verde
  const diffBars = DIFFS.map((d,i)=>{
    const on = temNota && Number(t.difficulty) === d.v;
    return `<button class="bar ${on?"on":""}" data-act="setDiff" data-sid="${s.id}" data-tid="${t.id}" data-v="${d.v}"
      role="radio" aria-checked="${on}" aria-label="${i+1} de 4 - ${d.label}"><i></i><b>${ROMAN[i]}</b></button>`;
  }).join("");
  const nivelTxt = temNota
    ? "Nível " + ROMAN[DIFFS.findIndex(d=>d.v === Number(t.difficulty))] + " · " + diffLabel(t.difficulty)
    : "Nenhum nível marcado";
  // prática sugerida quando o conteúdo está marcado para revisão
  const praticaSugerida = t.definitions.length ? "def" : (t.cards.length ? "card" : (t.ws ? "ws" : null));

  const expDef = !!(ui.expand && ui.expand.def);
  const expCard = !!(ui.expand && ui.expand.card);
  const defs = t.definitions.length
    ? t.definitions.slice(0, expDef ? t.definitions.length : 2).map(d=>`<div class="item" style="align-items:flex-start">
        <span class="txt"><b>${esc(d.term)}</b><span style="white-space:pre-wrap;color:var(--xb9c8dd)">${esc(d.def)}</span></span>
        <button class="icon-btn sm" data-act="delDef" data-tid="${t.id}" data-id="${d.id}">✕</button>
      </div>`).join("")
    : '<div class="empty">Nenhuma definição. Ex: “O que é o Excel?”</div>';

  const cards = t.cards.length
    ? t.cards.slice(0, expCard ? t.cards.length : 2).map(d=>`<div class="item" style="align-items:flex-start">
        <span class="txt"><b>${esc(d.front)}</b><span style="white-space:pre-wrap;color:var(--xb9c8dd)">${esc(d.back)}</span></span>
        <button class="icon-btn sm" data-act="delCard" data-tid="${t.id}" data-id="${d.id}">✕</button>
      </div>`).join("")
    : '<div class="empty">Nenhum card. Ex: “Era Vargas?” / resposta no verso.</div>';

  const avisoRevisao = revisaoDe(t);
  const quizInfo = t.quiz || {};
  const ult = quizInfo.ultimo || null;
  const listaQ = ui.qlist === t.id;
  const questoes = (t.questions && t.questions.length)
    ? t.questions.map((q,qi)=>`<div class="item" style="align-items:flex-start">
        <span class="txt"><b>${qi+1}. ${esc(q.text)}</b>
          <span style="color:var(--xb9c8dd)">${q.options.length} alternativas${q.comment ? " · com comentário" : ""}</span></span>
        <button class="icon-btn sm" data-act="editQuestion" data-tid="${t.id}" data-qid="${q.id}" title="Editar">✏️</button>
        <button class="icon-btn sm" data-act="delQuestion" data-tid="${t.id}" data-qid="${q.id}" title="Apagar">✕</button>
      </div>`).join("")
    : '<div class="empty">Nenhuma questão ainda. Ex: “O que é a crase?” com 4 alternativas.</div>';

  const wsWords = t.ws && t.ws.words && t.ws.words.length
    ? t.ws.words.map(w=>`<span class="chip">${esc(w)}<button class="x" data-act="delWsWord" data-tid="${t.id}" data-w="${esc(w)}">✕</button></span>`).join("")
    : '<span class="tiny muted">Adicione de 4 a 10 palavras e toque em gerar.</span>';

  return `
    <div class="page-head">
      <button class="back" data-act="backTopic">‹</button>
      <h2>${esc(t.name)}</h2>
      <span class="sp grow"></span>
      <button class="btn xs ghost" data-act="renameTopic" data-sid="${s.id}" data-tid="${t.id}" title="Editar nome do conteúdo">✏️</button>
      <button class="btn xs ghost" data-act="delTopic" data-sid="${s.id}" data-tid="${t.id}">🗑️</button>
    </div>
    <p class="tiny muted" style="margin:-6px 0 12px">${esc(s.name)}</p>

    <div class="card">
      <div class="card-title"><h3>🔗 Links e vídeos</h3><span class="sp"></span>
        <button class="btn xs" data-act="addLink" data-tid="${t.id}">+ Link</button>
      </div>
      ${(t.links||[]).length ? t.links.map(l=>linkHtml(t, l)).join("") : '<div class="empty">Cole o link de um vídeo do YouTube ou de um site para estudar este conteúdo.</div>'}
    </div>

    <div class="card">
      <div class="card-title"><h3>📕 Ebook / PDF</h3><span class="sp"></span>
        <label class="btn xs" style="cursor:pointer">+ PDF
          <input type="file" accept="application/pdf,.pdf" data-act-change="pdfFile" data-tid="${t.id}" style="display:none">
        </label>
      </div>
      ${(t.pdfs||[]).length ? t.pdfs.map(f=>pdfHtml(t, f)).join("") : '<div class="empty">Escolha o PDF (ebook) desta aula. Ele fica salvo no aparelho e abre com um toque.</div>'}
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;gap:12px">
        <button class="item" style="border:0;background:none;padding:0;width:auto" data-act="toggleTopic" data-sid="${s.id}" data-tid="${t.id}">
          <span class="check ${t.done?"on":""}">✓</span>
          <span class="txt"><b>Aula concluída</b><span>${t.done ? "Concluída ✔" : "Toque para marcar"}</span></span>
        </button>
        <div style="text-align:right"><div class="eyebrow">Horas aqui</div>
          <div style="font-size:18px;font-weight:750">${mins ? fmtMin(mins) : "0min"}</div></div>
      </div>
      <div class="divider"></div>
      <div class="eyebrow" style="margin-bottom:8px">Dificuldade do conteúdo</div>
      <div class="bars">${diffBars}</div>

/* ==================================================================

   ================================================================== */
function emptySchedule(){
  return { days: DAYS.map(d=>({ dia:d.n, cargaHoras:0, observacao:"", blocks:[] })), meta:{}, importedAt:null };
}
function ensureSchedule(c){
  if(!c.schedule || !Array.isArray(c.schedule.days) || c.schedule.days.length !== 7){
    c.schedule = emptySchedule();
  }
  if(!c.schedule.meta) c.schedule.meta = {};
  return c.schedule;
}
function scheduleMinutes(c){
  return (c.schedule && c.schedule.days ? c.schedule.days : [])
    .reduce((a,d)=> a + d.blocks.reduce((x,b)=> x + (Number(b.minutos)||0), 0), 0);
}
function diaDaSemana(c, n){
  const dias = ensureSchedule(c).days || [];
  return dias.find(d=>Number(d.dia) === Number(n)) || { dia:n, cargaHoras:0, observacao:"", blocks:[] };
}
function findBlock(c, bid){
  for(const d of ((c.schedule && c.schedule.days) || [])){
    const b = d.blocks.find(x=>x.id === bid);
    if(b) return { dia:d, block:b };
  }
  return null;
}

/* quantas práticas existem numa matéria */
function practiceCounts(s){
  const tot = { def:0, card:0, quiz:0, ws:0, total:0 };
  s.topics.forEach(t=>{
    tot.def  += t.definitions.length;
    tot.card += t.cards.length;
    tot.quiz += (t.questions || []).length;
    tot.ws   += t.ws ? 1 : 0;
  });
  tot.total = tot.def + tot.card + tot.quiz + tot.ws;
  return tot;
}

function practiceResumo(s){
  const n = practiceCounts(s);
  if(!n.total) return "Nada para praticar ainda";
  const p = [];
  if(n.def)  p.push("📝 " + n.def + (n.def===1 ? " definição" : " definições"));
  if(n.card) p.push("🃏 " + n.card + (n.card===1 ? " card" : " cards"));
  if(n.quiz) p.push("❓ " + n.quiz + (n.quiz===1 ? " questão" : " questões"));
  if(n.ws)   p.push("🔎 " + (n.ws===1 ? "caça-palavras" : "caça-palavras"));
  return p.join(" · ");
}

function findTopicById(tid){
  for(const c of db.concursos){
    for(const s of c.subjects){
      const t = s.topics.find(x=>x.id === tid);
      if(t) return { concurso:c, subject:s, topic:t };
    }
  }
  return null;
}

function startPractice(type, tid){
  const found = findTopicById(tid);
  if(!found) return toast("Conteúdo não encontrado");
  ui.cid = found.concurso.id;
  ui.sid = found.subject.id;
  ui.tid = tid;
  ui.practice = { type, tid, index:0, revealed:false, flipped:false, hits:0, misses:0, answered:null, summary:false, setup: type !== "ws", itemsId:null };
  ui.tab = "practice";
  ui.ws = { start:null, sel:[] };
  render();
}

const LETRAS = ["A","B","C","D","E","F"];

function notaPratica(p){
  const total = p.hits + p.misses;
  const pct = total ? Math.round(p.hits * 100 / total) : 0;
  return { total, pct };
}
function conselhoNota(pct){
  if(pct >= 85) return { titulo:"Mandou bem!", txt:"Você domina esse conteúdo. Pode avançar para o próximo.", cor:"g" };
  if(pct >= 60) return { titulo:"Está no caminho", txt:"Revise só o que errou antes de avançar. Uma passada rápida resolve.", cor:"y" };
  if(pct >= 35) return { titulo:"Vale revisar", txt:"Releia esse conteúdo e refaça a prática: você acertou menos da metade.", cor:"r" };
  return { titulo:"Revise com calma", txt:"Ainda não fixou. Releia a teoria, veja os cards e faça questões até passar de 70%.", cor:"r" };
}
function salvarPratica(t, tipo, p){
  const { total, pct } = notaPratica(p);
  if(!t || !total) return;
  t.praticas = t.praticas || {};
  t.praticas[tipo] = { pct, acertos:p.hits, total, data: todayISO() };
  if(tipo === "quiz"){
    t.quiz = t.quiz || {};
    t.quiz.ultimo = { pct, acertos:p.hits, total, data: todayISO() };
    t.quiz.melhor = Math.max(Number(t.quiz.melhor) || 0, pct);
    t.quiz.rodadas = (Number(t.quiz.rodadas) || 0) + 1;
  }
  if(t.progresso) delete t.progresso[tipo];
  t.lastDone = todayISO();
  saveDB();
}
function renderResumo(t, p, titulo){
  const { total, pct } = notaPratica(p);
  const cons = conselhoNota(pct);
  return `
    <div class="page-head">
      <button class="back" data-act="endPractice">‹</button>
      <h2>${esc(titulo)}</h2>
    </div>
    <div class="practice-stage" style="text-align:center">
      <div class="eyebrow">${esc(t.name)}</div>
      <div style="font-size:44px;font-weight:800;letter-spacing:-1px;margin:6px 0">${p.hits}<span style="color:var(--muted);font-size:22px">/${total}</span></div>
      <div class="small muted">${pct}% de acerto</div>
    </div>
    <div class="resumo ${cons.cor}">
      <b>${cons.titulo}</b>
      <span>${cons.txt}</span>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary grow" data-act="againPractice">🔁 Refazer</button>
      <button class="btn grow" data-act="endPractice">Sair</button>

}

/* quanto itens a prática tem e quais foram escolhidos */
function fonteDaPratica(t, tipo){
  if(!t) return [];
  if(tipo === "def") return t.definitions || [];
  if(tipo === "card") return t.cards || [];
  if(tipo === "quiz") return t.questions || [];
  return [];
}
function tipoTxt(tipo, n){
  const sing = tipo === "def" ? "definição" : tipo === "card" ? "card" : "questão";
  const plur = tipo === "def" ? "definições" : tipo === "card" ? "cards" : "questões";
  return n === 1 ? sing : plur;
}
function itensDaPratica(t, p){
  const fonte = fonteDaPratica(t, p.type);
  if(!p.itemsId || !p.itemsId.length) return fonte;
  const mapa = new Map(fonte.map(x=>[x.id, x]));
  return p.itemsId.map(id=>mapa.get(id)).filter(Boolean);
}
function salvarProgresso(t, p){
  if(!t || !p) return;
  const total = (p.itemsId || []).length;
  const feitos = Math.min(p.index, total);
  t.progresso = t.progresso || {};
  if(!total || feitos >= total) delete t.progresso[p.type];
  else t.progresso[p.type] = { ids:p.itemsId, pos:feitos, hits:p.hits, misses:p.misses, total, data: todayISO() };
  saveDB();
}
function renderSetupPratica(t, p){
  const total = fonteDaPratica(t, p.type).length;
  const prog = (t.progresso || {})[p.type];
  const podeRetomar = prog && prog.pos > 0 && prog.pos < prog.total;
  const nums = [...new Set([5, 10, total])].filter(n=>n > 0 && n <= total).sort((a,b)=>a-b);
  return `
    <div class="page-head">
      <button class="back" data-act="endPractice">‹</button>
      <h2>Praticar</h2>
    </div>
    <div class="practice-stage">
      <div class="eyebrow">${esc(t.name)}</div>
      <div class="qtext" style="font-size:19px">Quantas ${tipoTxt(p.type, 2)} você quer fazer?</div>
      <p class="small muted" style="margin-top:4px">Este conteúdo tem ${total} ${tipoTxt(p.type, total)}.</p>
      ${podeRetomar ? `<button class="btn primary block" style="margin-top:14px" data-act="resumePratica">▶️ Continuar de onde parei (${prog.pos} de ${prog.total})</button>` : ""}
      <div class="row wrap" style="margin-top:${podeRetomar ? 10 : 16}px;gap:8px">
        ${nums.map(n=>`<button class="btn grow" data-act="startQty" data-q="${n}">${n === total ? "Todas (" + total + ")" : n}</button>`).join("")}
      </div>
      ${prog && prog.pos >= prog.total ? "" : `<p class="hint" style="margin-top:12px">O progresso fica salvo: se parar no meio, pode continuar depois.</p>`}
    </div>`;
}
/* finalizar com confirmação */

function renderWsBoard(t, ws){
  const size = ws.size;
  const foundCells = new Set();
  (ws.placed||[]).forEach(p=>{
    if((ws.found||[]).includes(p.word)) p.cells.forEach(([r,c])=>foundCells.add(r+"-"+c));
  });
  const selSet = new Set((ui.ws.sel||[]).map(([r,c])=>r+"-"+c));
  const start = ui.ws.start;

  let cells = "";
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      const key = r+"-"+c;
      const cls = foundCells.has(key) ? "found"
        : (start && start[0]===r && start[1]===c) ? "sel"
        : selSet.has(key) ? "sel" : "";
      cells += `<button class="ws-cell ${cls}" data-act="wsCell" data-tid="${t.id}" data-r="${r}" data-c="${c}">${esc(ws.grid[r][c])}</button>`;
    }
  }
  const words = (ws.words||[]).map(w=>{
    const done = (ws.found||[]).includes(w);
    return `<span class="ws-word ${done?"done":""}">${esc(w)}</span>`;
  }).join("");

  const allDone = (ws.words||[]).every(w => (ws.found||[]).includes(w));

  return `
    <div class="page-head">
      <button class="back" data-act="endPractice">‹</button>
      <h2>Caça-palavras</h2>
      <span class="sp grow"></span>
      <span class="badge">${(ws.found||[]).length}/${(ws.words||[]).length}</span>
    </div>
    <p class="tiny muted" style="margin:-6px 0 10px">${esc(t.name)} · toque na primeira e na última letra da palavra.</p>
    <div class="ws-grid" id="wsGrid" style="grid-template-columns:repeat(${size},1fr)">${cells}</div>
    <div class="ws-words">${words}</div>
    ${allDone ? '<div class="callout" style="margin-top:12px">🎉 Você achou todas as palavras!</div>' : ''}
    <div class="row" style="margin-top:12px">
      <button class="btn grow" data-act="wsReset" data-tid="${t.id}">🔄 Recomeçar</button>

    </div>
