/* ==================================================================
   PLANO DE ESTUDO: horas por dia -> data de término + semáforo
   ================================================================== */
function planoEstudo(c){
  const st = stats(c);
  const dh = Number(c.dailyHours) || 0;
  if(!dh) return { set:false, st, dh:0 };
  if(st.remaining <= 0) return { set:true, done:true, st, dh };
  const needDays = Math.ceil(st.remaining / (dh * 60));
  const fim = new Date(); fim.setHours(0,0,0,0); fim.setDate(fim.getDate() + needDays);
  const fimISO = fim.getFullYear() + "-" + pad(fim.getMonth()+1) + "-" + pad(fim.getDate());
  let level = "n", margin = null;
  if(st.days != null && st.days >= 0){
    margin = st.days - needDays;
    if(st.days === 0) level = "r";
    else {
      const ratio = needDays / st.days;
      level = ratio <= 0.8 ? "g" : ratio <= 1 ? "y" : "r";
    }
  }
  return { set:true, done:false, st, dh, needDays, fimISO, level, margin };
}
function plural(n, um, varios){ return n + " " + (Math.abs(n) === 1 ? um : varios); }

function planoHtml(c){
  const p = planoEstudo(c);
  if(!p.set){
    return `<div class="plan">
      <div class="plan-t">Quantas horas por dia você vai estudar?</div>
      <div class="plan-d muted">Defina e eu calculo em que dia você termina e se dá tempo até a prova.</div>
      <button class="btn sm block" style="margin-top:10px" data-act="setDaily" data-cid="${c.id}">Definir horas por dia</button>
    </div>`;
  }
  const horasTxt = fmtMin(p.dh * 60);
  if(p.done){
    return `<div class="plan g">
      <div class="plan-top"><span class="pill">🟢 Concluído</span></div>
      <div class="plan-t">Você já cumpriu o tempo necessário de estudos. 🎉</div>
      <button class="btn xs" style="margin-top:10px" data-act="setDaily" data-cid="${c.id}">Alterar horas por dia</button>
    </div>`;
  }
  const fimBR = dateBR(p.fimISO);
  let pill = "Defina a data da prova", detalhe = "Cadastre a data da prova para ver se o prazo está confortável.";
  if(p.level === "g"){
    pill = "🟢 Tempo de sobra";
    detalhe = "Você termina " + plural(p.margin, "dia", "dias") + " antes da prova. Siga no ritmo.";
  } else if(p.level === "y"){
    pill = "🟡 Sobra pouco tempo";
    detalhe = p.margin > 0
      ? "Você termina só " + plural(p.margin, "dia", "dias") + " antes da prova. Não perca nenhum dia de estudo."
      : "Você termina no dia da prova. Não pode faltar nenhum dia.";
  } else if(p.level === "r"){
    pill = "🔴 Tempo curto";
    detalhe = "Nesse ritmo você termina " + (p.margin < 0 ? plural(-p.margin, "dia", "dias") + " depois da prova" : "só no dia da prova")
      + ". Para dar tempo, estude pelo menos <b>" + fmtMin(p.st.perDay) + " por dia</b>.";
  }
  return `<div class="plan ${p.level === "n" ? "" : p.level}">
    <div class="plan-top"><span class="pill">${pill}</span></div>
    <div class="plan-t">Você irá estudar <b>${horasTxt} por dia</b></div>
    <div class="plan-d">Terminando em <b>${fimBR}</b> (${plural(p.needDays, "dia", "dias")}).</div>
    <div class="plan-d muted">${detalhe}</div>
    <button class="btn xs" style="margin-top:10px" data-act="setDaily" data-cid="${c.id}">Alterar horas por dia</button>
  </div>`;
}

/* lê o JSON do cronograma (formato do exemplo) */
function parseSchedule(raw){
  const j = JSON.parse(raw);
  const cron = Array.isArray(j) ? j
    : (j.cronograma_semanal || j.cronograma || j.schedule || j.dias || null);
  if(!Array.isArray(cron) || !cron.length) throw new Error("sem cronograma_semanal");

  const days = DAYS.map(d=>({ dia:d.n, cargaHoras:0, observacao:"", blocks:[] }));
  const disciplinas = new Set();

  cron.forEach(item=>{
    if(!item || typeof item !== "object") return;
    const n = dayFromText(item.dia || item.day || item.dia_semana || "");
    if(n === null) return;
    const alvo = days.find(d=>d.dia === n);
    alvo.cargaHoras = Number(item.carga_horas != null ? item.carga_horas : item.horas) || 0;
    alvo.observacao = item.observacao || item.obs || "";
    const blocos = item.blocos || item.blocks || [];
    (Array.isArray(blocos) ? blocos : []).forEach(b=>{
      if(!b || typeof b !== "object") return;
      const horario = b.horario || [b.inicio, b.fim].filter(Boolean).join(" - ");
      const minutos = Number(b.duracao_minutos != null ? b.duracao_minutos : b.minutos) || minutosDoHorario(horario);
      const disc = b.disciplina || b.materia || b.matéria || "";
      if(disc) disciplinas.add(String(disc).trim());
      alvo.blocks.push({
        id: uid(),
        horario: String(horario || "").trim(),
        minutos,
        disciplina: String(disc).trim(),
        foco: String(b.foco || "").trim(),
        metodologia: String(b.metodologia || "").trim()
      });
    });
    alvo.blocks.sort((a,b)=> String(a.horario||"").localeCompare(String(b.horario||"")));
  });

  return {
    days,
    disciplinas: Array.from(disciplinas),
    meta: {
      concurso: j.concurso || "",
      carga: j.carga_horaria_semanal || null,
      dist: j.distribuicao_questoes || null
    }
  };
}

function questionModal(t, q){
  const opts = q ? q.options : [];
  const linhas = [0,1,2,3,4].map(i=>{
    const marcado = (q ? Number(q.correct) === i : i === 0) ? "checked" : "";
    const valor = opts[i] ? esc(opts[i]) : "";
    return `<div class="row" style="gap:8px;align-items:center;margin-top:8px">
      <input type="radio" name="correct" value="${i}" id="qc${i}" class="rad" title="Marcar como correta" ${marcado}>
      <input id="qo${i}" name="o${i}" class="input" type="text" maxlength="200"
        placeholder="Alternativa ${LETRAS[i]}" value="${valor}">
    </div>`;
  }).join("");

  showModal(q ? "Editar questão" : "Nova questão", `
    <div class="field">
      <label for="qText">Questão <span class="tiny">(múltipla escolha · 1 correta)</span></label>
      <div class="row">
        <textarea id="qText" name="text" class="input" style="min-height:70px" maxlength="600" placeholder="Ex: O que é a crase?" required>${esc(q ? q.text : "")}</textarea>
        <button type="button" class="icon-btn" data-act="dictate" data-target="qText" title="Falar">🎤</button>
      </div>
    </div>
    <div class="field">
      <label>Alternativas <span class="tiny">(marque a bolinha da correta)</span></label>
      ${linhas}
      <div class="hint">Preencha as 5 alternativas (A a E) e marque a bolinha da correta. Se quiser menos, deixe as últimas em branco (mínimo 2).</div>
    </div>
    <div class="field">
      <label for="qComment">Comentário (opcional)</label>
      <input id="qComment" name="comment" class="input" type="text" maxlength="300" placeholder="Ex: Crase é a fusão de duas vogais iguais" value="${esc(q ? q.comment : "")}">
    </div>
  `, "Salvar questão", (vals)=>{
    const text = (vals.text || "").trim();
    if(!text) return toast("Escreva a questão") || false;
    const preenchidas = [0,1,2,3,4]
      .map(i=>({ i, txt: String(vals["o"+i] || "").trim() }))
      .filter(o=>o.txt);
    if(preenchidas.length < 2) return toast("Escreva pelo menos 2 alternativas") || false;
    const marcada = Number(vals.correct);
    if(!preenchidas.some(o=>o.i === marcada)) return toast("Marque a alternativa correta") || false;
    const options = preenchidas.map(o=>o.txt);
    const correct = preenchidas.findIndex(o=>o.i === marcada);
    const comment = (vals.comment || "").trim();
    if(q){
      q.text = text; q.options = options; q.correct = correct; q.comment = comment;
    }else{
      t.questions.push({ id: uid(), text, options, correct, comment });
    }
    saveDB(); render(); toast(q ? "Questão atualizada" : "Questão criada");
    return true;
  });
}

/* lê o JSON de questões (formato: { titulo, questoes:[{pergunta, opcoes, correta, explicacao}] }) */
function parseQuestions(raw){
  const txt = String(raw || "").trim();
  if(!txt) return { erro:"vazio" };
  let j;
  try{ j = JSON.parse(txt); }catch(e){ return { erro:"json" }; }
  const lista = Array.isArray(j) ? j
    : (j.questoes || j.questions || j.perguntas || j.itens || j.lista || null);
  if(!Array.isArray(lista)) return { erro:"estrutura" };

  const itens = [];
  lista.forEach(x=>{
    if(!x || typeof x !== "object") return;
    const text = String(x.pergunta || x.questao || x.question || x.enunciado || x.text || "").trim();
    const ops = x.opcoes || x.opções || x.alternativas || x.options || x.respostas || [];
    const options = (Array.isArray(ops) ? ops : [])
      .map(o=> typeof o === "string" ? o.trim() : String((o && (o.texto || o.text || o.nome)) || "").trim())
      .filter(Boolean);
    if(!text || options.length < 2) return;

    let corr = (x.correta !== undefined) ? x.correta
             : (x.correct !== undefined) ? x.correct
             : (x.gabarito !== undefined) ? x.gabarito
             : x.resposta;
    let idx = null;
    if(typeof corr === "number" && isFinite(corr)) idx = Math.trunc(corr);
    else if(typeof corr === "string"){
      const t = corr.trim();
      if(/^[A-Fa-f]$/.test(t)) idx = "ABCDEF".indexOf(t.toUpperCase());
      else if(t !== "" && !isNaN(Number(t))) idx = Number(t);
      else {
        const pos = options.findIndex(o=>norm(o) === norm(t));
        if(pos >= 0) idx = pos;
      }
    }
    if(idx === null) idx = 0;
    /* aceita índice começando em 1 quando o número estoura a lista */
    if(idx >= options.length && idx - 1 >= 0 && idx - 1 < options.length) idx = idx - 1;
    if(idx < 0 || idx >= options.length) idx = 0;

    const comment = String(x.explicacao || x.explicação || x.explicacao || x.comentario ||
      x.comment || x.justificativa || "").trim();
    itens.push({ text, options, correct: idx, comment });
  });
  return { itens };
}

/* aceita lista em JSON ou texto separado por vírgula / linha */
function parseNameList(raw){
  const txt = String(raw || "").trim();
  if(!txt) return { itens:[], tipo:"vazio" };
  const comecaJSON = txt[0] === "[" || txt[0] === "{";
  if(comecaJSON){
    let j;
    try{ j = JSON.parse(txt); }catch(e){ return { erro:"json" }; }
    let lista = Array.isArray(j) ? j : null;
    if(!lista && j && typeof j === "object"){
      lista = j.materias || j.matérias || j.subjects || j.conteudos || j.conteúdos ||
              j.topics || j.itens || j.items || j.lista || null;
    }
    if(!Array.isArray(lista)) return { erro:"json" };
    const itens = lista.map(x=>{
      if(typeof x === "string") return { nome:x.trim(), conteudos:[], dificuldade:null, feito:false };
      if(x && typeof x === "object"){
        const nome = x.nome || x.name || x.materia || x.matéria || x.disciplina || x.titulo || x.title || "";
        const filhos = x.conteudos || x.conteúdos || x.topics || x.assuntos || x.itens || [];
        const dif = (x.dificuldade !== undefined) ? x.dificuldade : x.difficulty;
        return {
          nome: String(nome).trim(),
          conteudos: Array.isArray(filhos)
            ? filhos.map(y=> typeof y === "string" ? y.trim() : String((y && (y.nome || y.name || y.titulo || y.title)) || "").trim()).filter(Boolean)
            : [],
          dificuldade: (dif === 0 || dif) && [0,3,4,5].includes(Number(dif)) ? Number(dif) : null,
          feito: !!x.feito || !!x.done
        };
      }
      return null;
    }).filter(x=>x && x.nome);
    return { itens, tipo:"json" };
  }
  const partes = txt.split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean);
  return { itens: partes.map(n=>({ nome:n, conteudos:[], dificuldade:null, feito:false })), tipo:"texto" };
}

function importarMaterias(c, itens){
  if(!c) return "Crie um concurso primeiro";
  let novas = 0, novosConteudos = 0;
  itens.forEach(it=>{
    let s = c.subjects.find(x=>norm(x.name) === norm(it.nome));
    if(!s){
      s = { id: uid(), name: it.nome, color: SUBJECT_COLORS[c.subjects.length % SUBJECT_COLORS.length], topics: [] };
      c.subjects.push(s);
      novas++;
    }
    (it.conteudos || []).forEach(nome=>{
      if(!nome) return;
      if(s.topics.some(t=>norm(t.name) === norm(nome))) return;
      s.topics.push({ id: uid(), name: nome, done:false, difficulty:null, definitions:[], cards:[], questions:[], ws:null });
      novosConteudos++;
    });
  });
  const partes = [];
  if(novas) partes.push(novas + " matéria" + (novas===1?"":"s"));
  if(novosConteudos) partes.push(novosConteudos + " conteúdo" + (novosConteudos===1?"":"s"));
  return partes.length ? "Adicionado: " + partes.join(" e ") : "Tudo já existia por aqui";
}

function importarConteudos(c, sid, itens){
  const s = c && c.subjects.find(x=>x.id === sid);
  if(!s) return "Matéria não encontrada";
  let novos = 0, repetidos = 0;
  itens.forEach(it=>{
    if(s.topics.some(t=>norm(t.name) === norm(it.nome))){ repetidos++; return; }
    s.topics.push({
      id: uid(), name: it.nome, done: !!it.feito, difficulty: it.dificuldade || null,
      definitions:[], cards:[], questions:[], ws:null
    });
    novos++;
  });
  if(!novos) return "Esses conteúdos já existem aqui";
  return novos + " conteúdo" + (novos===1?"":"s") + " adicionado" + (novos===1?"":"s") + (repetidos ? " · " + repetidos + " já existia(m)" : "");
}

/* ---------- importar "nome,definição" (cards, definições e caça-palavras) ---------- */
function parsePares(raw){
  const txt = String(raw||"").replace(/\r/g,"").trim();
  if(!txt) return [];
  const linhas = txt.split("\n").map(l=>l.trim()).filter(Boolean);
  const pares = [];
  // tudo numa linha só, alternando nome,definição,nome,definição
  if(linhas.length === 1){
    const partes = linhas[0].split(",").map(x=>x.trim()).filter(Boolean);
    if(partes.length >= 4 && partes.length % 2 === 0){
      for(let i=0;i<partes.length;i+=2) pares.push({ term:partes[i], def:partes[i+1] });
      return pares;
    }
  }
  // uma por linha: a primeira vírgula separa o nome da definição
  linhas.forEach(l=>{
    const i = l.indexOf(",");
    if(i < 1) return;
    const term = l.slice(0,i).trim(), def = l.slice(i+1).trim();
    if(term && def) pares.push({ term, def });
  });
  return pares;
}

ACTIONS.importPairs = (el)=>{
  const c = concursoAtual(); if(!c) return toast("Crie um concurso primeiro");
  let s = null, fixo = null;
  if(el.dataset.tid){
    const f = findTopicById(el.dataset.tid); if(!f) return;
    s = f.subject; fixo = f.topic;
  } else {
    s = c.subjects.find(x=>x.id === el.dataset.sid);
  }
  if(!s) return;
  if(!s.topics.length) return toast("Crie um conteúdo nesta matéria primeiro");
  const kind = el.dataset.kind || "card";
  const opts = s.topics.map(t=>`<option value="${t.id}" ${fixo && fixo.id === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("");
  showModal("Importar nome,definição", `
    <div class="field">
      <label for="ipTopic">Conteúdo de destino</label>
      <select id="ipTopic" name="tid" class="input">${opts}</select>
    </div>
    <div class="field">
      <label for="ipTxt">Cole aqui (um por linha)</label>
      <textarea id="ipTxt" name="texto" class="input" style="min-height:150px" placeholder="FUTEBOL,É um esporte onde jogadores jogam num campo e quem fizer gols ganha&#10;REGRA DE 3,É uma regra na matemática que avalia grandezas diferentes"></textarea>
      <div class="hint">Formato: <b>nome,definição</b>. A primeira vírgula separa as duas partes.</div>
    </div>
    <div class="field">
      <label>Importar como</label>
      <label class="row" style="gap:10px;margin-top:6px"><input type="checkbox" name="kCard" value="1" ${kind === "card" ? "checked" : ""}> 🃏 Cards (nome na frente, definição no verso)</label>
      <label class="row" style="gap:10px;margin-top:6px"><input type="checkbox" name="kDef" value="1" ${kind === "def" ? "checked" : ""}> 📝 Definições</label>
      <label class="row" style="gap:10px;margin-top:6px"><input type="checkbox" name="kWs" value="1" ${kind === "ws" ? "checked" : ""}> 🔎 Caça-palavras (usa o nome, de 3 a 14 letras)</label>
    </div>
  `, "Importar", (vals)=>{
    const f = findTopicById(vals.tid); if(!f) return toast("Escolha o conteúdo") || false;
    const t = f.topic;
    const pares = parsePares(vals.texto);
    if(!pares.length) return toast("Não achei nenhum par. Use: nome,definição") || false;
    const wCard = !!vals.kCard, wDef = !!vals.kDef, wWs = !!vals.kWs;
    if(!wCard && !wDef && !wWs) return toast("Marque onde importar") || false;
    const chave = x => String(x||"").trim().toLowerCase();
    let nCard = 0, nDef = 0, nWs = 0, ign = 0;

    if(wCard){
      pares.forEach(p=>{
        if(t.cards.some(k=>chave(k.front) === chave(p.term))) return;
        t.cards.push({ id: uid(), front: p.term.slice(0,120), back: p.def.slice(0,800) }); nCard++;
      });
    }
    if(wDef){
      pares.forEach(p=>{
        if(t.definitions.some(d=>chave(d.term) === chave(p.term))) return;
        t.definitions.push({ id: uid(), term: p.term.slice(0,120), def: p.def.slice(0,800) }); nDef++;
      });
    }
    if(wWs){
      const atuais = (t.ws && t.ws.words) ? t.ws.words.slice() : [];
      const novas = [];
      pares.forEach(p=>{
        const w = normWord(p.term);
        if(w.length < 3 || w.length > 14){ ign++; return; }
        if(atuais.includes(w) || novas.includes(w)) return;
        novas.push(w);
      });
      if(novas.length){
        const todas = atuais.concat(novas);
        const rebuilt = buildWs(todas);
        if(rebuilt){ t.ws = Object.assign(rebuilt, { words: todas }); nWs = novas.length; }
      }
    }

    const partes = [];
    if(wCard) partes.push(nCard + " card" + (nCard===1?"":"s"));
    if(wDef) partes.push(nDef + " definiç" + (nDef===1?"ão":"ões"));
    if(wWs) partes.push(nWs + " palavra" + (nWs===1?"":"s"));
    saveDB(); render();
    toast("Importado: " + partes.join(" · ") + (ign ? " · " + ign + " fora de 3–14 letras" : ""));
    return true;
  });
};

/* ---------- caça-palavras: jogo ---------- */
ACTIONS.wsCell = (el)=>{
  const p = ui.practice;
  if(!p || p.type !== "ws") return;
  const t = findTopicById(el.dataset.tid)?.topic; if(!t || !t.ws) return;
  const ws = t.ws;
  const cell = [Number(el.dataset.r), Number(el.dataset.c)];

  if(!ui.ws.start){
    ui.ws.start = cell;
    ui.ws.sel = [cell];
    render();
    return;
  }
  const path = linePath(ui.ws.start, cell);
  if(!path){ ui.ws.start = cell; ui.ws.sel = [cell]; render(); return; }

  const letters = path.map(([r,c]) => ws.grid[r][c]).join("");
  const rev = letters.split("").reverse().join("");
  const hit = (ws.placed||[]).find(pl =>
    (pl.word === letters || pl.word === rev) && !(ws.found||[]).includes(pl.word)
  );

  ui.ws.start = null;
  ui.ws.sel = [];
  if(hit){
    ws.found = (ws.found||[]).concat(hit.word);
    saveDB();
    if(ws.found.length === (ws.words||[]).length) toast("🎉 Todas as palavras!");
    else toast("Achou: " + hit.word);
  }
  render();
};

ACTIONS.wsReveal = (el)=>{
  const t = findTopicById(el.dataset.tid)?.topic; if(!t || !t.ws) return;
  t.ws.found = (t.ws.words||[]).slice();
  saveDB(); render(); toast("Gabarito revelado");
};

ACTIONS.wsReset = (el)=>{
  const t = findTopicById(el.dataset.tid)?.topic; if(!t || !t.ws) return;
  const words = t.ws.words.slice();
  const rebuilt = buildWs(words);
  t.ws = Object.assign(rebuilt || t.ws, { words, found: [] });
  saveDB(); ui.ws = { start:null, sel:[] }; render(); toast("Jogo reiniciado");
};

    </div>
  `;
}

/* ==================================================================
   TELA: DADOS (backup, reset, perfil)
   ================================================================== */
function viewDados(){

  const subs = db.concursos.reduce((a,c)=>a+c.subjects.length,0);
  const tops = db.concursos.reduce((a,c)=>a+c.subjects.reduce((b,s)=>b+s.topics.length,0),0);

  const idadeTxt = idade() ? idade() + " anos" : "";

  return `
    <div class="page-head"><h2>Dados</h2></div>

    <div class="card">
      <div class="row" style="gap:12px">
        <div class="avatar" style="width:56px;height:56px;font-size:19px">${photoURL() ? '<img src="'+photoURL()+'">' : esc(initials())}</div>
        <div class="grow" style="min-width:0">
          <div style="font-weight:700;font-size:16px">${esc(db.profile.name)}</div>
          <div class="tiny muted">${db.profile.birthDate ? dateBR(db.profile.birthDate)+(idadeTxt ? " · "+idadeTxt : "") : "sem data de nascimento"}</div>
        </div>
        <button class="btn xs" data-act="editProfile">Editar</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><h3>📊 Resumo</h3></div>
      <div class="kv"><span>Concursos</span><b>${conc}</b></div>
      <div class="kv"><span>Matérias</span><b>${subs}</b></div>
      <div class="kv"><span>Conteúdos</span><b>${tops}</b></div>
      <div class="kv"><span>Horas registradas</span><b>${fmtMin(mins)}</b></div>
    </div>

    <div class="card">
      <div class="card-title"><h3>💾 Backup</h3></div>
      <p class="small muted" style="margin-bottom:12px">Salva <b>todo o conteúdo</b> (perfil, concursos, matérias, conteúdos, definições, cards, caça-palavras e horas) num arquivo .json.</p>
      <button class="btn primary block" data-act="exportBackup">⬇️ Salvar backup (.json)</button>
      <button class="btn block" style="margin-top:8px" data-act="importBackup">⬆️ Restaurar backup</button>
      <input type="file" id="importFile" accept=".json,application/json" class="hidden">
      <p class="hint">Restaurar substitui os dados atuais deste aparelho pelos do arquivo.</p>
    </div>

    <div class="card">
      <div class="card-title"><h3>🧹 Apagar e redefinir</h3></div>
      <p class="small muted" style="margin-bottom:12px">Zera tudo e volta para a tela de primeiro acesso. Não tem como desfazer.</p>
      <button class="btn danger block" data-act="resetAll">Apagar todos os dados</button>
    </div>

    <p class="tiny muted" style="text-align:center;margin-top:16px">HelpEstudo v${APP_VERSION} · dados salvos só neste aparelho</p>
  `;
}

function minutesOfAll(){
  return db.log.reduce((a,l)=>a+(Number(l.minutes)||0),0);
}

/* ---------- backup ---------- */
ACTIONS.exportBackup = ()=>{
  const payload = {
    app: "HelpEstudo",
    version: 1,
    exportedAt: new Date().toISOString(),
    data: db
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const nome = "helpestudo-backup-" + todayISO() + ".json";
  const a = document.createElement("a");
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast("Backup salvo: " + nome);
};

ACTIONS.importBackup = ()=>{
  const inp = document.getElementById("importFile");
  if(!inp) return;
  inp.value = "";
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(String(reader.result));
        const data = parsed && parsed.data ? parsed.data : parsed;
        if(!data || !Array.isArray(data.concursos)) throw new Error("formato");
        const novo = normalize(data);
        if(!novo.profile.name) novo.profile.name = db.profile.name || "Estudante";
        confirmBox("Restaurar backup?", "Os dados atuais serão substituídos pelos do arquivo.", ()=>{
          db = novo;
          ui = Object.assign(ui, { tab:"home", cid:db.concursos[0] ? db.concursos[0].id : null, sid:null, tid:null, practice:null });
          db.activeId = ui.cid;
          saveDB(); render(); toast("Backup restaurado");
        });
      }catch(e){
        toast("Arquivo inválido. Use um backup do HelpEstudo.");
      }
    };
    reader.readAsText(f);
  };
  inp.click();
};

ACTIONS.resetAll = ()=>{
  confirmBox("Apagar tudo e redefinir?", "Perfil, concursos, matérias, conteúdos e horas serão apagados deste aparelho. Faça um backup antes, se quiser guardar.", ()=>{
    try{ store.removeItem(STORAGE_KEY); }catch(e){}
    db = newDB();
    ui = { tab:"home", cid:null, sid:null, tid:null, practice:null, psub:null, ws:{start:null,sel:[]}, tmpPhoto:"" };
    render();
    toast("Tudo apagado. Bons estudos!");
  });
};

/* ==================================================================
   PERFIL
   ================================================================== */
function openProfileModal(){
  ui.tmpPhoto = photoURL();
  showModal("Seu perfil", `
    <div class="photo-pick">
      <label for="pfPhoto" class="photo-ring ${ui.tmpPhoto?"has":""}" id="pfRing">
        ${ui.tmpPhoto ? '<img src="'+ui.tmpPhoto+'" id="pfImg">' : '<span id="pfTxt">Toque para escolher</span>'}
      </label>
      <input id="pfPhoto" type="file" accept="image/*" class="hidden">
    </div>
    <div class="field">
      <label for="pfName">Nome</label>
      <input id="pfName" name="name" class="input" type="text" value="${esc(db.profile.name)}" maxlength="40" required>
    </div>
    <div class="field">
      <label for="pfBirth">Data de nascimento</label>
      <input id="pfBirth" name="birthDate" class="input" type="date" value="${esc(db.profile.birthDate||"")}">
    </div>
  `, "Salvar perfil", (vals)=>{
    const name = (vals.name||"").trim();
    if(!name) return toast("Digite seu nome") || false;

    db.profile.birthDate = vals.birthDate || "";

    return true;
  }, { after: ()=>{

    if(inp) inp.addEventListener("change", ()=> handlePhoto(inp, document.getElementById("pfRing"), (url)=>{
      ui.tmpPhoto = url;
    }));
  }});
}

/* lê a foto, reduz e devolve dataURL */
function handlePhoto(input, ring, cb){
  const f = input.files && input.files[0];
  if(!f) return;
  if(!/^image\//.test(f.type)) return toast("Escolha uma imagem");
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const size = 320;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side)/2, sy = (img.height - side)/2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      let url = "";
      try{ url = canvas.toDataURL("image/jpeg", 0.82); }catch(e){ url = String(reader.result); }
      if(ring){
        ring.classList.add("has");
        ring.innerHTML = '<img src="'+url+'" alt="foto">';
      }
      if(cb) cb(url);
    };
    img.onerror = ()=> toast("Não consegui abrir a imagem");
    img.src = String(reader.result);
  };
  reader.readAsDataURL(f);
}

/* ==================================================================
   MODAL / CONFIRMAÇÃO
   ================================================================== */
let modalSubmit = null;

function showModal(title, bodyHTML, submitLabel, onSubmit, opts={}){
  modalSubmit = onSubmit;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" data-act="closeModal"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="icon-btn sm" data-act="closeModal" aria-label="Fechar">✕</button>
      </div>
      <form id="modalForm" novalidate>
        <div class="modal-body">${bodyHTML}</div>
        <div class="modal-foot">
          <button type="button" class="btn ghost" data-act="closeModal">Cancelar</button>
          <button type="submit" class="btn primary">${esc(submitLabel||"Salvar")}</button>
        </div>
      </form>
    </div>`;
  root.classList.add("open");

  const form = document.getElementById("modalForm");
  form.addEventListener("submit", (ev)=>{
    ev.preventDefault();
    const fd = new FormData(form);
    const vals = {};
    fd.forEach((v,k)=>{ vals[k] = typeof v === "string" ? v : v; });
    const res = modalSubmit ? modalSubmit(vals, form) : true;
    if(res !== false) closeModal();
  });

  if(opts.after) try{ opts.after(); }catch(e){ console.warn(e); }
  setTimeout(()=>{
    const first = form.querySelector("input:not([type=hidden]),textarea");
    if(first && !("ontouchstart" in window)) first.focus();
  }, 60);
}

function closeModal(){
  const root = document.getElementById("modalRoot");
  root.classList.remove("open");
  root.innerHTML = "";
  modalSubmit = null;
}

ACTIONS.closeModal = ()=>{ closeModal(); };

/* ---------- caixinha de exemplo de JSON (abre por cima do modal) ---------- */
function exemploBox(titulo, texto, dica){
  const root = document.getElementById("exemploRoot");
  root.innerHTML = `
    <div class="modal-backdrop" data-act="closeExemplo"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3>${esc(titulo)}</h3>
        <button class="icon-btn sm" data-act="closeExemplo" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body">
        ${dica ? `<p class="small muted" style="margin-bottom:10px">${dica}</p>` : ""}
        <pre id="exemploTexto" class="info-box" style="white-space:pre-wrap;font-size:10.5px;line-height:1.55;max-height:46vh;overflow:auto">${esc(texto)}</pre>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn ghost" data-act="closeExemplo">Fechar</button>
        <button type="button" class="btn primary" data-act="copyExemplo">📋 Copiar exemplo</button>
      </div>
    </div>`;
  root.classList.add("open");
  const pre = document.getElementById("exemploTexto");
  if(pre) pre.scrollTop = 0;
}
function closeExemplo(){
  const root = document.getElementById("exemploRoot");
  if(!root) return;
  root.classList.remove("open");
  root.innerHTML = "";
}
ACTIONS.closeExemplo = ()=>{ closeExemplo(); };

function copiarTexto(txt, ok){
  const fallback = ()=>{
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let deu = false;
    try{ deu = document.execCommand("copy"); }catch(e){ deu = false; }
    document.body.removeChild(ta);
    deu ? ok() : toast("Selecione o texto e copie na mão");
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(fallback);
  }else fallback();
}

ACTIONS.copyExemplo = ()=>{
  const el = document.getElementById("exemploTexto");
  const txt = el ? el.textContent : "";
  if(!txt) return;
  copiarTexto(txt, ()=> toast("Exemplo copiado"));
};

let confirmCb = null;
function confirmBox(title, text, onYes){
  confirmCb = onYes;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" data-act="closeModal"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${esc(title)}</h3></div>
      <p class="small muted" style="margin-bottom:16px">${esc(text)}</p>
      <div class="modal-foot">
        <button class="btn ghost" data-act="closeModal">Cancelar</button>
        <button class="btn danger" data-act="confirmYes">Sim, apagar</button>
      </div>
    </div>`;
  root.classList.add("open");
}

ACTIONS.confirmYes = ()=>{
  const cb = confirmCb;
  confirmCb = null;
  closeModal();
  if(cb) cb();
};

/* fecha modal com ESC */
document.addEventListener("keydown", (ev)=>{
  if(ev.key === "Escape") closeModal();
});

/* ==================================================================
   ONBOARDING
   ================================================================== */
function bindOnboarding(){
  document.querySelectorAll('[data-act="obPickPhoto"]').forEach(b=>{
    b.addEventListener("click", ()=> document.getElementById("obPhoto").click());
  });
  document.getElementById("obPhoto").addEventListener("change", (ev)=>{
    handlePhoto(ev.target, document.getElementById("obPhotoRing"), (url)=>{
      ui.tmpPhoto = url;
      document.getElementById("obPhotoTxt") && (document.getElementById("obPhotoTxt").textContent = "Trocar foto");
    });
  });

  document.getElementById("onboardForm").addEventListener("submit", (ev)=>{
    ev.preventDefault();
    const name = document.getElementById("obName").value.trim();
    const birth = document.getElementById("obBirth").value;
    if(!name) return toast("Digite seu nome");
    if(!ui.tmpPhoto) toast("Sem foto tudo bem, você pode colocar depois");
    db = newDB();
    db.profile.name = name;
    db.profile.birthDate = birth || "";
    db.profile.photo = ui.tmpPhoto || "";
    saveDB();
    render();
    ui.tab = "home";
    setTimeout(()=> toast("Bem-vindo, " + name.split(" ")[0] + "!"), 150);
  });
}

/* ==================================================================
   INICIALIZAÇÃO
   ================================================================== */
(function init(){
  db = loadDB();
  if(db && db.profile && db.profile.name){
    ui.cid = db.activeId || (db.concursos[0] ? db.concursos[0].id : null);
  }
  bindOnboarding();
  render();
})();
</script>
